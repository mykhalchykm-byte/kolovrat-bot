<style>
  :root {
      /* Збільшено відступ зверху (+ 32px), щоб програма була нижче від острівця iPhone */
      --safe-top: calc(env(safe-area-inset-top, 0px) + 32px);
      --safe-bottom: calc(env(safe-area-inset-bottom, 0px) + 12px);
      --bg: var(--tg-theme-bg-color, #ffffff);
      --text: var(--tg-theme-text-color, #000000);
      --hint: var(--tg-theme-hint-color, #8e8e93);
      --accent: #ff80ab;
      --card-bg: var(--tg-theme-secondary-bg-color, #f9f9f9);
      --border: rgba(0, 0, 0, 0.08);
    }

    [data-theme="dark"] {
      --border: rgba(255, 255, 255, 0.12);
      --card-bg: #1c1c1e;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      padding: 0;
      padding-top: var(--safe-top) !important;
      padding-bottom: var(--safe-bottom) !important;
      background-color: var(--bg);
      color: var(--text);

      overscroll-behavior-y: none;

:root {
  --bg: #f5f3f6;
  --surface: #ffffff;
  --ink: #1e1a22;
  --muted: #6f6676;
  --line: #e6e1e9;
  --accent: #8e2f5c;
  --accent-ink: #ffffff;
  --accent-soft: #f3dde8;
  --amber: #a86a0f;
  --amber-soft: #f8ecd2;
  --danger: #b3261e;
  --shadow: 0 1px 2px rgba(30, 26, 34, .06), 0 8px 24px rgba(30, 26, 34, .06);
  --r-lg: 20px;
  --r-md: 14px;
  --r-sm: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141116; --surface: #1e1a22; --ink: #f1ecf4; --muted: #a298ab; --line: #2d2733;
    --accent: #e58ab4; --accent-ink: #2a0f1d; --accent-soft: #3a2231;
    --amber: #e2b04a; --amber-soft: #38301c; --danger: #ff8a80;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px rgba(0, 0, 0, .3);
  }
}
:root[data-theme="dark"] {
  --bg: #141116; --surface: #1e1a22; --ink: #f1ecf4; --muted: #a298ab; --line: #2d2733;
  --accent: #e58ab4; --accent-ink: #2a0f1d; --accent-soft: #3a2231;
  --amber: #e2b04a; --amber-soft: #38301c; --danger: #ff8a80;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px rgba(0, 0, 0, .3);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--ink); }
body {
  font-family: "Onest", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  font-size: 15px; line-height: 1.45; min-height: 100dvh;
  -webkit-font-smoothing: antialiased; overscroll-behavior: none;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.num { font-variant-numeric: tabular-nums; }

#app { max-width: 560px; margin: 0 auto; padding: 16px 16px calc(92px + env(safe-area-inset-bottom)); }
.hidden { display: none !important; }

/* ---------- Календар: дата дня ---------- */
.dayhead { display: flex; align-items: flex-end; gap: 14px; padding: 8px 4px 14px; }
.bigday { font-size: 72px; line-height: .86; font-weight: 800; letter-spacing: -.04em; color: var(--accent); }
.daymeta { flex: 1; min-width: 0; padding-bottom: 4px; }
.daymeta .wd { font-size: 22px; font-weight: 700; letter-spacing: -.01em; text-transform: capitalize; }
.daymeta .mo { color: var(--muted); font-size: 14px; }
.addbtn {
  display: inline-flex; align-items: center; gap: 6px; height: 40px; padding: 0 16px;
  background: var(--accent); color: var(--accent-ink); border-radius: 999px; font-weight: 600;
  box-shadow: var(--shadow);
}
.addbtn svg { width: 16px; height: 16px; }

/* ---------- Тиждень ---------- */
.week { display: grid; grid-template-columns: 32px repeat(7, 1fr) 32px; align-items: center; gap: 2px; margin-bottom: 18px; }
.navbtn { height: 52px; color: var(--muted); display: grid; place-items: center; border-radius: 10px; }
.navbtn svg { width: 18px; height: 18px; }
.day { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 0 7px; border-radius: var(--r-md); min-height: 64px; }
.day .w { font-size: 12px; color: var(--muted); text-transform: lowercase; }
.day .d { font-size: 17px; font-weight: 600; }
.day .dots { display: flex; gap: 3px; height: 6px; margin-top: 3px; }
.day .dots i { width: 5px; height: 5px; border-radius: 50%; background: var(--accent); }
.day .dots i.p { background: none; border: 1.5px solid var(--amber); width: 6px; height: 6px; }
.day.today .d { color: var(--accent); }
.day.sel { background: var(--accent); }
.day.sel .w, .day.sel .d { color: var(--accent-ink); }
.day.sel .dots i { background: var(--accent-ink); }
.day.sel .dots i.p { background: none; border-color: var(--accent-ink); }

/* ---------- Блоки ---------- */
.block { background: var(--surface); border-radius: var(--r-lg); box-shadow: var(--shadow); padding: 6px 16px; margin-bottom: 16px; }

.pend { border: 1.5px dashed var(--amber); background: var(--amber-soft); box-shadow: none; padding: 12px 14px; }
.pend h2 { color: var(--amber); margin: 0 0 8px; }
.pitem { padding: 10px 0; border-top: 1px solid color-mix(in srgb, var(--amber) 25%, transparent); }
.pitem:first-of-type { border-top: 0; padding-top: 2px; }
.pitem .t { font-weight: 600; }
.pitem .s { color: var(--muted); font-size: 13px; margin-top: 1px; }
.pitem .acts { display: flex; gap: 8px; margin-top: 10px; }
.btn { height: 38px; padding: 0 16px; border-radius: 999px; font-weight: 600; font-size: 14px; background: var(--accent); color: var(--accent-ink); }
.btn.ghost { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--line); }
.btn.danger { color: var(--danger); }

/* ---------- Стрічка подій ---------- */
.tl { list-style: none; margin: 0; padding: 0; }
.evw { border-top: 1px solid var(--line); }
.tl > li:first-child .evw { border-top: 0; }
.ev { display: grid; grid-template-columns: 64px 1fr; gap: 12px; padding: 14px 0; text-align: left; width: 100%; }
.ev .tm { font-size: 20px; font-weight: 700; letter-spacing: -.02em; line-height: 1.1; }
.ev .du { color: var(--muted); font-size: 12px; margin-top: 3px; }
.ev .ti { font-weight: 600; font-size: 16px; line-height: 1.3; }
.ev .me { color: var(--muted); font-size: 13px; margin-top: 2px; }
.ev.past .tm, .ev.past .ti { color: var(--muted); }
.more { display: none; padding: 0 0 14px 76px; }
.open .more { display: block; }
.more p { margin: 0 0 10px; color: var(--ink); font-size: 14px; white-space: pre-wrap; }
.now { display: flex; align-items: center; gap: 8px; color: var(--accent); font-size: 12px; font-weight: 600; padding: 2px 0; }
.now::after { content: ""; flex: 1; height: 1.5px; background: var(--accent); opacity: .5; }
.empty { text-align: center; padding: 28px 8px 30px; color: var(--muted); }
.empty b { display: block; color: var(--ink); font-size: 16px; margin-bottom: 4px; }

/* ---------- Керування ---------- */
.stat { display: flex; justify-content: space-between; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); }
.stat:first-of-type { border-top: 0; }

.search { width: 100%; height: 44px; border-radius: var(--r-md); border: 1.5px solid var(--line); background: var(--surface); padding: 0 14px; margin: 4px 0 12px; }
.search:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: transparent; }
.chat { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); }
.chat:first-child { border-top: 0; }
.av { width: 40px; height: 40px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font-weight: 700; flex: none; }
.chat .nm { flex: 1; min-width: 0; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chips { display: flex; gap: 6px; flex: none; }
.chip { height: 34px; padding: 0 12px; border-radius: 999px; font-size: 13px; font-weight: 600; color: var(--muted); box-shadow: inset 0 0 0 1.5px var(--line); transition: background .15s, color .15s; }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); box-shadow: none; }
.hint { color: var(--muted); font-size: 13px; margin: 0 4px 12px; }

/* ---------- Нижня панель ---------- */
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; display: flex; justify-content: center;
  padding: 8px 16px calc(10px + env(safe-area-inset-bottom));
  background: linear-gradient(to top, var(--bg) 70%, transparent);
}
.tabs { display: flex; gap: 2px; padding: 4px; background: var(--surface); border-radius: 26px; box-shadow: var(--shadow); width: 100%; max-width: 440px; }
.tab { flex: 1; height: 54px; border-radius: 22px; font-weight: 600; font-size: 11.5px; color: var(--muted); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; }
.tab svg { width: 20px; height: 20px; }
.tab[aria-selected="true"] { background: var(--accent-soft); color: var(--accent); }

/* ---------- Форма ---------- */
.sheet-wrap { position: fixed; inset: 0; z-index: 10; display: flex; align-items: flex-end; justify-content: center; background: rgba(10, 6, 12, .5); }
.sheet { width: 100%; max-width: 560px; background: var(--surface); border-radius: 24px 24px 0 0; padding: 18px 18px calc(20px + env(safe-area-inset-bottom)); max-height: 92dvh; overflow: auto; animation: up .22s ease-out; }
@keyframes up { from { transform: translateY(30px); opacity: .4; } to { transform: none; opacity: 1; } }
.sheet h3 { margin: 0 0 14px; font-size: 20px; letter-spacing: -.01em; }
.field { display: block; margin-bottom: 12px; }
.field > span { display: block; font-size: 13px; color: var(--muted); margin-bottom: 5px; }
.inp { width: 100%; height: 46px; border-radius: var(--r-md); border: 1.5px solid var(--line); background: var(--bg); padding: 0 12px; }
textarea.inp { height: 72px; padding: 10px 12px; resize: none; }
.inp:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: transparent; }
.row2 { display: grid; grid-template-columns: 1.3fr 1fr; gap: 10px; }
.opts { display: flex; flex-wrap: wrap; gap: 6px; }
.opts .chip { height: 36px; }
.sheet .acts { display: flex; gap: 10px; margin-top: 16px; }
.sheet .acts .btn { flex: 1; height: 48px; font-size: 16px; }
.err { color: var(--danger); font-size: 13px; margin-top: 8px; min-height: 1em; }

.toast { position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 20; background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-size: 14px; max-width: 90vw; }
.fatal { padding: 40px 12px; text-align: center; color: var(--muted); }
.fatal b { display: block; color: var(--ink); font-size: 18px; margin-bottom: 6px; }
.fatal code { background: var(--surface); padding: 2px 6px; border-radius: 6px; font-size: 13px; }

/* ---------- Чати ---------- */
.crow { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); width: 100%; text-align: left; }
#clist > .crow:first-child, #clist > .notice + .crow { border-top: 0; }
.cm { flex: 1; min-width: 0; }
.cn { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cl { color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cr { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; flex: none; min-width: 34px; }
.ct { color: var(--muted); font-size: 12px; }
.badge { min-width: 22px; height: 22px; padding: 0 7px; border-radius: 11px; background: var(--accent-soft); color: var(--accent); font-size: 12px; font-weight: 700; display: grid; place-items: center; }
.k { font-weight: 600; }
.k.deleted { color: var(--danger); } .k.edited { color: var(--amber); } .k.mood, .k.flirt { color: var(--accent); }
.notice { background: var(--amber-soft); color: var(--ink); border-radius: var(--r-md); padding: 12px 14px; margin: 8px 0; font-size: 13px; }
.notice code { background: var(--surface); padding: 1px 5px; border-radius: 5px; }

body::before { content: ""; position: fixed; top: 0; left: 0; right: 0; height: var(--safe-top); background: var(--bg); z-index: 6; }
.cstick { position: sticky; top: var(--safe-top); z-index: 7; background: var(--bg); margin: 0 -16px 8px; padding: 4px 16px 8px; border-bottom: 1px solid var(--line); }
.cstick .tgl { margin: 0; }
.chead { display: flex; align-items: center; gap: 12px; padding: 4px 0 12px; }
.back { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: var(--surface); box-shadow: var(--shadow); flex: none; }
.back svg { width: 18px; height: 18px; }
.chead .cn { font-size: 20px; font-weight: 700; letter-spacing: -.01em; }
.tgl { display: flex; align-items: center; gap: 8px; margin: 0 0 6px; color: var(--muted); font-size: 13px; }
.day-sep { text-align: center; color: var(--muted); font-size: 12px; margin: 18px 0 10px; }
.fc { background: var(--surface); border-radius: var(--r-lg); box-shadow: var(--shadow); padding: 12px 14px; margin-bottom: 10px; }
.fh { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 13px; }
.fh b { font-weight: 700; }
.fh time { color: var(--muted); }
.fc.deleted .fh b { color: var(--danger); } .fc.edited .fh b { color: var(--amber); } .fc.mood .fh b, .fc.flirt .fh b { color: var(--accent); }
.qt { color: var(--muted); font-size: 13px; border-left: 3px solid var(--line); padding-left: 10px; margin-bottom: 10px; white-space: pre-wrap; overflow-wrap: anywhere; }
.bd { white-space: pre-wrap; overflow-wrap: anywhere; }
.opt { display: flex; align-items: flex-start; gap: 8px; padding: 10px 6px 10px 12px; background: var(--bg); border-radius: var(--r-md); margin-top: 8px; }
.opt span { flex: 1; white-space: pre-wrap; overflow-wrap: anywhere; }
.cpy { width: 34px; height: 34px; border-radius: 50%; color: var(--accent); display: grid; place-items: center; flex: none; }
.cpy svg { width: 18px; height: 18px; }
.was, .now2 { white-space: pre-wrap; overflow-wrap: anywhere; }
.was { margin-bottom: 10px; color: var(--muted); }
.was em, .now2 em { display: block; font-style: normal; font-size: 12px; color: var(--muted); margin-bottom: 1px; }
.fc img, .fc video { max-width: 100%; max-height: 360px; border-radius: var(--r-md); display: block; margin-bottom: 8px; }
.fc audio { width: 100%; margin-bottom: 8px; }
.fc a { color: var(--accent); font-weight: 600; }
.mdn { color: var(--muted); font-size: 13px; margin-bottom: 6px; }
.moreb { display: block; margin: 0 auto 8px; }

/* ---------- Асистент ---------- */
.msgs { display: flex; flex-direction: column; gap: 8px; padding-bottom: 150px; }
.bub { max-width: 86%; padding: 10px 14px; border-radius: 18px; white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.4; }
.bub.me { align-self: flex-end; background: var(--accent); color: var(--accent-ink); border-bottom-right-radius: 6px; }
.bub.bot { align-self: flex-start; background: var(--surface); box-shadow: var(--shadow); border-bottom-left-radius: 6px; }
.bub.err { color: var(--danger); }
.typing { display: flex; gap: 4px; padding: 15px 16px; }
.typing i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); animation: blink 1s infinite ease-in-out; }
.typing i:nth-child(2) { animation-delay: .15s; } .typing i:nth-child(3) { animation-delay: .3s; }
@keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }
.sugg { display: flex; flex-direction: column; align-items: stretch; gap: 8px; margin-top: 14px; }
.sugg .chip { height: auto; min-height: 42px; padding: 10px 16px; text-align: left; font-weight: 500; border-radius: var(--r-md); color: var(--ink); }
.composer { position: fixed; left: 0; right: 0; bottom: calc(88px + env(safe-area-inset-bottom)); z-index: 6; padding: 8px 16px; display: flex; justify-content: center; }
.composer form { display: flex; align-items: flex-end; gap: 8px; width: 100%; max-width: 560px; background: var(--surface); border-radius: 26px; box-shadow: var(--shadow); padding: 6px 6px 6px 18px; }
.composer textarea { flex: 1; min-width: 0; border: 0; background: transparent; resize: none; max-height: 120px; padding: 9px 0; outline: none; line-height: 1.35; }
.send { width: 40px; height: 40px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; flex: none; }
.send:disabled { opacity: .35; }
.send svg { width: 18px; height: 18px; }
body.kb .tabbar { display: none; }
body.kb .composer { bottom: 0; padding-bottom: calc(8px + env(safe-area-inset-bottom)); }
.linkbtn { color: var(--muted); font-size: 13px; font-weight: 600; padding: 8px 4px; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
html.web { --safe-top: calc(env(safe-area-inset-top, 0px) + 8px); }
.login { max-width: 360px; margin: 18vh auto 0; text-align: center; }
.login h1 { font-size: 26px; font-weight: 800; letter-spacing: -.02em; margin: 0 0 6px; }
.login p { color: var(--muted); font-size: 14px; margin: 0 0 18px; }
.login input { width: 100%; height: 50px; border-radius: 14px; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); padding: 0 16px; font-size: 17px; margin-bottom: 12px; }
.login .btn { width: 100%; height: 50px; font-size: 16px; }
.login .err { color: var(--danger); font-size: 14px; min-height: 20px; margin-bottom: 8px; }
.pushbox { padding: 16px 18px 18px; }
.pushbox .acts { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.pushbox .note { color: var(--muted); font-size: 13px; margin: 6px 0 0; }
</style>

const dayKey = (d) => fmtKey().format(new Date(d));
const noon = (k) => new Date(k + "T12:00:00Z");
const addDays = (k, n) => { const d = noon(k); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
const monIdx = (k) => (noon(k).getUTCDay() + 6) % 7;
const timeStr = (iso) => new Intl.DateTimeFormat("uk-UA", { timeZone: S.tz, hour: "2-digit", minute: "2-digit", hour12: false }).format(new Date(iso));
const todayKey = () => dayKey(Date.now());
const WD_SHORT = ["пн", "вт", "ср", "чт", "пт", "сб", "нд"];
const longDate = (iso) => new Intl.DateTimeFormat("uk-UA", { timeZone: S.tz, weekday: "short", day: "numeric", month: "long" }).format(new Date(iso));
const durLabel = (e) => {
  const m = Math.round((new Date(e.end_at) - new Date(e.start_at)) / 60000);
  if (!(m > 0)) return "";
  return m < 60 ? `${m} хв` : m % 60 ? `${Math.floor(m / 60)} г ${m % 60} хв` : `${m / 60} г`;
};
const remLabel = (m) => (m == null ? "" : m >= 1440 ? "за добу" : m >= 60 ? `за ${m / 60} г` : m === 0 ? "в момент події" : `за ${m} хв`);

// ---------- API ----------
async function api(action, body = {}) {
  if (DEMO) return demoApi(action, body);
  const r = await fetch(API_URL, {
    method: "POST",
    headers: initData ? { "content-type": "application/json", "x-init-data": initData } : { "content-type": "application/json", "x-app-key": getKey() },
    body: JSON.stringify({ action, ...body }),
  });
  let j = {};
  try { j = await r.json(); } catch (_) {}
  if (r.status === 401 && !initData) { setKey(""); showLogin("Невірний код доступу."); }
  if (!r.ok) { const e = new Error(j.error || "http"); e.code = j.error; e.status = r.status; e.detail = j.message; throw e; }
  return j;
}
function errText(e) {
  if (e.code === "not_owner") return "Застосунок відкривається лише для власника акаунта, до якого підключено бота.";
  if (e.code === "auth" && !initData) return "Невірний код доступу.";
  if (e.code === "auth") return "Не вдалося перевірити вхід. Закрийте застосунок і відкрийте його знову з чату з ботом.";
  if (e.code === "db") return "Не вдалося зберегти. Перевірте, що таблиці в Supabase створено." + (e.detail ? " (" + e.detail + ")" : "");
  return "Немає зв'язку з ботом. Перевірте інтернет і спробуйте ще раз.";
}

function render() {
  const app = $("#app");
  let v;
  if (S.tab === "cal") v = viewCal();
  else if (S.tab === "chats") v = S.cv != null ? viewChat() : viewChats();
  else if (S.tab === "ai") v = viewAI();
  else v = viewBot();
  app.innerHTML = v + tabbar() + (S.sheet ? sheet() : "");
  document.body.classList.remove("kb");
  bind();
  syncBack();
  if (S.scrollDown) { S.scrollDown = false; window.scrollTo(0, document.documentElement.scrollHeight); }
}

function tabbar() {
  return `<nav class="tabbar"><div class="tabs" role="tablist">
    <button class="tab" role="tab" data-tab="cal" aria-selected="${S.tab === "cal"}">${ICON.cal}Календар</button>
    <button class="tab" role="tab" data-tab="chats" aria-selected="${S.tab === "chats"}">${ICON.chats}Чати</button>
    <button class="tab" role="tab" data-tab="ai" aria-selected="${S.tab === "ai"}">${ICON.ai}Асистент</button>
    <button class="tab" role="tab" data-tab="bot" aria-selected="${S.tab === "bot"}">${ICON.bot}Бот</button>
  </div></nav>`;
}

function viewCal() {
  const today = todayKey();
  const sel = S.sel;
  const start = addDays(sel, -monIdx(sel));
  const byDay = {};
  for (const e of S.events) (byDay[dayKey(e.start_at)] ||= []).push(e);
  const d = noon(sel);
  const wd = new Intl.DateTimeFormat("uk-UA", { timeZone: "UTC", weekday: "long" }).format(d);
  const mo = new Intl.DateTimeFormat("uk-UA", { timeZone: "UTC", month: "long", year: "numeric" }).format(d);

  let week = `<button class="navbtn" data-wk="-1" aria-label="Попередній тиждень">${ICON.prev}</button>`;
  for (let i = 0; i < 7; i++) {
    const k = addDays(start, i), list = byDay[k] || [];
    const dots = list.slice(0, 3).map((e) => `<i class="${e.status === "pending" ? "p" : ""}"></i>`).join("");
    week += `<button class="day${k === sel ? " sel" : ""}${k === today ? " today" : ""}" data-day="${k}" aria-label="${k}" aria-pressed="${k === sel}">
      <span class="w">${WD_SHORT[i]}</span><span class="d num">${+k.slice(8)}</span><span class="dots">${dots}</span></button>`;
  }
  week += `<button class="navbtn" data-wk="1" aria-label="Наступний тиждень">${ICON.next}</button>`;

  const pend = S.events.filter((e) => e.status === "pending" && new Date(e.start_at) > Date.now() - 3600e3);
  const pendHtml = pend.length ? `<section class="block pend" aria-label="Плани з чатів"><h2>Знайшов у чатах: ${pend.length}</h2>${pend.map((e) => `
    <div class="pitem"><div class="t">${esc(e.title)}</div>
    <div class="s">${esc(longDate(e.start_at))}, ${timeStr(e.start_at)}${e.source_name ? " · " + esc(e.source_name) : ""}</div>
    <div class="acts"><button class="btn" data-ok="${e.id}">Додати</button><button class="btn ghost" data-no="${e.id}">Пропустити</button></div></div>`).join("")}</section>` : "";

  const day = (byDay[sel] || []).filter((e) => e.status === "confirmed");
  let list = "";
  if (!day.length) {
    list = `<div class="empty"><b>Вільний день</b>Додайте подію або напишіть про неї в чаті, бот сам її знайде.</div>`;
  } else {
    const nowMs = Date.now();
    let marked = sel !== today;
    list = `<ul class="tl">` + day.map((e) => {
      let mark = "";
      if (!marked && new Date(e.start_at) > nowMs) { marked = true; mark = `<li class="now" aria-label="Зараз">зараз</li>`; }
      const past = new Date(e.end_at) < nowMs;
      const open = S.openId === e.id;
      const meta = [e.source_name && e.source_name !== "Застосунок" ? "з чату " + e.source_name : "", e.remind_min != null ? "нагадаю " + remLabel(e.remind_min) : ""].filter(Boolean).join(", ");
      return mark + `<li><div class="evw${open ? " open" : ""}"><button class="ev${past ? " past" : ""}" data-ev="${e.id}" aria-expanded="${open}">
        <div><div class="tm num">${timeStr(e.start_at)}</div><div class="du">${esc(durLabel(e))}</div></div>
        <div><div class="ti">${esc(e.title)}</div>${meta ? `<div class="me">${esc(meta)}</div>` : ""}</div></button>
        <div class="more">${e.notes ? `<p>${esc(e.notes)}</p>` : ""}<button class="btn ghost danger" data-del="${e.id}">Видалити</button></div></div></li>`;
    }).join("");
    if (!marked && sel === today) list += `<li class="now" aria-label="Зараз">зараз</li>`;
    list += `</ul>`;
  }

  return `<header class="dayhead"><div class="bigday num">${+sel.slice(8)}</div>
    <div class="daymeta"><div class="wd">${esc(wd)}</div><div class="mo">${esc(mo)}</div></div>
    <button class="addbtn" data-add>${ICON.plus}Подія</button></header>
    <div class="week">${week}</div>${pendHtml}<section class="block" aria-label="Події дня">${list}</section>`;
}

// ---------- Чати: стрічка по кожній людині ----------
const KIND = { deleted: "Видалене", edited: "Змінене", mood: "Настрій", flirt: "Флірт" };
const MEDIA = { photo: "Фото", video: "Відео", voice: "Голосове", audio: "Аудіо", video_note: "Відеокружок", document: "Файл", sticker: "Стікер", animation: "GIF" };
const initial = (n) => esc((n || "?").trim().charAt(0).toUpperCase());
const shortWhen = (iso) => dayKey(iso) === todayKey()
  ? timeStr(iso)
  : new Intl.DateTimeFormat("uk-UA", { timeZone: S.tz, day: "2-digit", month: "2-digit" }).format(new Date(iso));
const dayLbl = (iso) => { const k = dayKey(iso), t = todayKey(); return k === t ? "Сьогодні" : k === addDays(t, -1) ? "Вчора" : longDate(iso); };
const prevText = (c) => String(c.last_body || "").split("\n")[0].replace(/^\d\)\s*/, "");

function chatRows() {
  const list = S.cchats;
  let out = "";
  if (S.feedErr) out += `<div class="notice">Стрічка ще не підключена: створіть у Supabase таблицю <code>feed</code> (SQL з інструкції). ${esc(S.feedErr)}</div>`;
  if (list === null) return out + `<div class="empty">Завантаження…</div>`;
  const q = S.cq.trim().toLowerCase().replace(/^@/, "");
  const f = list.filter((c) => !q || String(c.name || "").toLowerCase().includes(q));
  if (!f.length) return out + `<div class="empty"><b>${q ? "Нікого не знайдено" : "Поки немає чатів"}</b>${q ? "Перевірте написання імені." : "Бот бачить лише тих, хто написав вам після підключення."}</div>`;
  return out + f.map((c) => `<button class="crow" data-chat="${c.chat_id}">
    <div class="av">${initial(c.name)}</div>
    <div class="cm"><div class="cn">${esc(c.name)}</div>
    <div class="cl">${c.last_kind ? `<span class="k ${c.last_kind}">${KIND[c.last_kind] || ""}</span> ${esc(prevText(c))}` : "Поки нічого"}</div></div>
    <div class="cr">${c.last_at ? `<span class="ct num">${shortWhen(c.last_at)}</span>` : ""}${c.count ? `<span class="badge num">${c.count}</span>` : ""}</div></button>`).join("");
}

function viewChats() {
  return `<header class="dayhead"><div class="daymeta"><div class="wd" style="font-size:28px;font-weight:800;letter-spacing:-.02em">Чати</div>
    <div class="mo">Видалене, змінене, настрій і флірт по кожній людині</div></div></header>
    <input class="search" id="cq" type="search" placeholder="Знайти людину" value="${esc(S.cq)}" aria-label="Знайти людину" autocomplete="off">
    <section class="block" aria-label="Люди"><div id="clist">${chatRows()}</div></section>`;
}

function mediaHtml(it) {
  if (!it.media_kind) return "";
  const label = MEDIA[it.media_kind] || "Файл";
  if (!it.url) return `<div class="mdn">${esc(label)}: файл недоступний</div>`;
  const u = esc(it.url);
  if (it.media_kind === "photo" || it.media_kind === "sticker") return `<img src="${u}" alt="${esc(label)}" loading="lazy">`;
  if (["video", "animation", "video_note"].includes(it.media_kind)) return `<video src="${u}" controls playsinline preload="metadata"></video>`;
  if (it.media_kind === "voice" || it.media_kind === "audio") return `<audio src="${u}" controls preload="none"></audio>`;
  return `<div class="mdn"><a href="${u}" target="_blank" rel="noopener">${esc(label)}: відкрити</a></div>`;
}

function card(it) {
  const label = KIND[it.kind] || it.kind;
  let inner = "";
  if (it.kind === "edited") {
    inner = `<div class="was"><em>Було</em><s>${esc(it.quote || "—")}</s></div><div class="now2"><em>Стало</em>${esc(it.body || "—")}</div>`;
  } else {
    if (it.quote) inner += `<div class="qt">${esc(it.quote)}</div>`;
    if (it.kind === "flirt") {
      const opts = String(it.body || "").split("\n").map((l) => l.trim()).filter((l) => /^\d\)/.test(l)).map((l) => l.replace(/^\d\)\s*/, ""));
      inner += opts.length
        ? opts.map((t) => `<div class="opt"><span>${esc(t)}</span><button class="cpy" data-copy="${esc(t)}" aria-label="Копіювати відповідь">${ICON.copy}</button></div>`).join("")
        : `<div class="bd">${esc(it.body)}</div>`;
    } else if (it.kind === "deleted") {
      inner += mediaHtml(it) + (it.body ? `<div class="bd">${esc(it.body)}</div>` : "");
    } else {
      inner += `<div class="bd">${esc(it.body)}</div>`;
    }
  }
  return `<article class="fc ${esc(it.kind)}"><div class="fh"><b>${esc(label)}</b><time class="num">${timeStr(it.at)}</time></div>${inner}</article>`;
}

function viewChat() {
  const c = (S.cchats || []).find((x) => x.chat_id === S.cv) || { name: "Чат", flirt: false, mood: false };
  let body = "";
  if (S.citems === null) body = `<div class="empty">Завантаження…</div>`;
  else if (S.itemsErr) body = `<div class="notice">${S.itemsErr.code === "db" ? "Не вдалося прочитати стрічку. Перевірте, що в Supabase створено таблицю <code>feed</code>." : esc(errText(S.itemsErr))}</div>`;
  else if (!S.citems.length) body = `<div class="empty"><b>Поки нічого</b>Тут з'являться видалені й змінені повідомлення, настрій і підказки для відповіді.</div>`;
  else {
    let last = "";
    body = (S.hasMore ? `<button class="btn ghost moreb" data-more>Показати раніше</button>` : "") + S.citems.map((it) => {
      const d = dayKey(it.at);
      const sep = d !== last ? `<div class="day-sep">${esc(dayLbl(it.at))}</div>` : "";
      last = d;
      return sep + card(it);
    }).join("");
  }
  return `<div class="cstick"><header class="chead"><button class="back" data-back aria-label="До списку чатів">${ICON.back}</button>
    <div class="cm"><div class="cn">${esc(c.name)}</div></div></header>
    <div class="tgl"><span>Бот стежить:</span>
      <button class="chip" data-t="flirt" data-id="${S.cv}" aria-pressed="${!!c.flirt}">Флірт</button>
      <button class="chip" data-t="mood" data-id="${S.cv}" aria-pressed="${!!c.mood}">Настрій</button></div></div>
    <div id="feed">${body}</div>`;
}

  return `<div class="sheet-wrap" data-close><form class="sheet" id="f" role="dialog" aria-label="Нова подія">
    <h3>Нова подія</h3>
    <label class="field"><span>Назва</span><input class="inp" name="title" maxlength="200" required placeholder="Наприклад, кава з Катею" autocomplete="off"></label>

    <div class="field"><span>Тривалість</span><div class="opts" data-group="dur">${[30, 60, 120, 240].map((m, i) => `<button type="button" class="chip" data-v="${m}" aria-pressed="${i === 1}">${m < 60 ? m + " хв" : m / 60 + " г"}</button>`).join("")}</div></div>
    <div class="field"><span>Нагадати</span><div class="opts" data-group="rem">${[10, 30, 60, 1440].map((m, i) => `<button type="button" class="chip" data-v="${m}" aria-pressed="${i === 1}">${remLabel(m)}</button>`).join("")}</div></div>
    <label class="field"><span>Нотатка</span><textarea class="inp" name="notes" maxlength="500" placeholder="Місце, деталі"></textarea></label>
    <div class="err" id="err" role="alert"></div>
    <div class="acts"><button type="button" class="btn ghost" data-cancel>Скасувати</button><button class="btn" type="submit">Додати подію</button></div></form></div>`;
}

// ---------- події ----------
function bind() {
  document.querySelectorAll("[data-tab]").forEach((b) => b.onclick = () => goTab(b.dataset.tab));
  document.querySelectorAll("[data-day]").forEach((b) => b.onclick = () => { S.sel = b.dataset.day; S.openId = null; buzz(); render(); });
  document.querySelectorAll("[data-wk]").forEach((b) => b.onclick = () => { S.sel = addDays(S.sel, 7 * +b.dataset.wk); S.openId = null; render(); });
  document.querySelectorAll("[data-ev]").forEach((b) => b.onclick = () => {
    const id = +b.dataset.ev; S.openId = S.openId === id ? null : id; render();
  });
  document.querySelectorAll("[data-del]").forEach((b) => b.onclick = () => mutate("event_delete", { id: +b.dataset.del }, "Подію видалено"));
  document.querySelectorAll("[data-ok]").forEach((b) => b.onclick = () => mutate("event_status", { id: +b.dataset.ok, status: "confirmed" }, "Додано в календар"));
  document.querySelectorAll("[data-no]").forEach((b) => b.onclick = () => mutate("event_status", { id: +b.dataset.no, status: "dismissed" }, "Пропущено"));
  const add = $("[data-add]"); if (add) add.onclick = () => { S.sheet = true; render(); const t = $('input[name="title"]'); t && t.focus(); };
  document.querySelectorAll(".chat .chip, .tgl .chip").forEach((b) => b.onclick = () => toggleChat(b));
  bindRows();
  const cq = $("#cq"); if (cq) cq.oninput = () => { S.cq = cq.value; refreshList(); };
  const back = $("[data-back]"); if (back) back.onclick = closeChat;
  const more = $("[data-more]"); if (more) more.onclick = moreFeed;
  document.querySelectorAll("[data-copy]").forEach((b) => b.onclick = () => copyText(b.dataset.copy));
  bindAI();
  const q = $("#q"); if (q) q.oninput = debounce(() => { S.q = q.value; loadChats(true); }, 350);
  if (S.sheet) bindSheet();
}

function bindSheet() {
  const close = () => { S.sheet = false; render(); };
  $("[data-cancel]").onclick = close;
  $(".sheet-wrap").onclick = (e) => { if (e.target.classList.contains("sheet-wrap")) close(); };
  document.querySelectorAll(".opts .chip").forEach((b) => b.onclick = () => {
    b.parentElement.querySelectorAll(".chip").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
  });
  $("#f").onsubmit = async (e) => {
    e.preventDefault();
    const f = e.target, v = (g) => +f.querySelector(`[data-group=${g}] [aria-pressed=true]`).dataset.v;
    const title = f.title.value.trim();
    if (!title) { $("#err").textContent = "Введіть назву події."; return; }
    const btn = f.querySelector("[type=submit]"); btn.disabled = true;
    try {
      const j = await api("event_add", { title, start: `${f.date.value}T${f.time.value}`, duration_min: v("dur"), remind_min: v("rem"), notes: f.notes.value.trim() });
      S.events = j.events; S.sel = f.date.value; S.sheet = false; buzz("medium"); render(); toast("Подію додано");
    } catch (err) { btn.disabled = false; $("#err").textContent = errText(err); }
  };
}

async function mutate(action, body, okText) {
  try { const j = await api(action, body); S.events = j.events; S.openId = null; buzz("medium"); render(); toast(okText); }
  catch (e) { toast(errText(e)); }
}

async function toggleChat(btn) {
  const kind = btn.dataset.t, id = +btn.dataset.id;
  const lists = [S.chats, S.cchats].filter(Boolean);
  const cur = lists.map((l) => l.find((x) => x.chat_id === id)).find(Boolean); if (!cur) return;
  const next = !cur[kind];
  const set = (v) => { lists.forEach((l) => { const x = l.find((y) => y.chat_id === id); if (x) x[kind] = v; }); btn.setAttribute("aria-pressed", String(v)); };
  set(next); buzz();
  try { await api("toggle", { kind, chat_id: id, enabled: next }); }
  catch (e) { set(!next); toast(errText(e)); }
}

async function loadChats(keepFocus) {
  try {
    const j = await api("chats", { q: S.q });
    S.chats = j.chats;
    if (S.tab === "bot") {
      const had = document.activeElement && document.activeElement.id === "q";
      const pos = had ? $("#q").selectionStart : 0;
      render();
      if (had) { const q = $("#q"); q.focus(); q.setSelectionRange(pos, pos); }
    }
  } catch (e) { S.chats = []; toast(errText(e)); if (S.tab === "bot") render(); }
}


// ---------- вкладки, чати, асистент: логіка ----------
function goTab(t) {
  S.cv = null; S.tab = t; buzz();
  if (t === "ai") S.scrollDown = true;
  render();
  if (t !== "ai") window.scrollTo(0, 0);
  if (t === "bot" && S.chats === null) loadChats();
  if (t === "chats") loadFeedChats();
  if (t === "ai" && S.msgs === null) loadAI();
}

let backBound = false;
function syncBack() {
  const bb = tg && tg.BackButton; if (!bb) return;
  if (!backBound) { bb.onClick(closeChat); backBound = true; }
  if (S.tab === "chats" && S.cv != null) bb.show(); else bb.hide();
}
let listScroll = 0; // позиція списку чатів, щоб після виходу з чату повернутися на те саме місце
function closeChat() { S.cv = null; render(); window.scrollTo(0, listScroll); loadFeedChats(); }

function bindRows() { document.querySelectorAll("[data-chat]").forEach((b) => b.onclick = () => openChat(+b.dataset.chat)); }
function refreshList() { const el = $("#clist"); if (el) { el.innerHTML = chatRows(); bindRows(); } else render(); }

async function loadFeedChats() {
  try {
    const j = await api("feed_chats");
    S.cchats = j.chats || []; S.feedErr = j.feed_ready === false ? (j.feed_error || " ") : null;
  } catch (e) { if (S.cchats === null) S.cchats = []; toast(errText(e)); }
  if (S.tab === "chats" && S.cv == null) refreshList();
}

async function openChat(id) {
  listScroll = window.scrollY; S.cv = id; S.citems = null; S.hasMore = false; S.itemsErr = null; buzz(); render(); window.scrollTo(0, 0);
  try { const j = await api("feed", { chat_id: id }); S.citems = j.items || []; S.hasMore = !!j.has_more; }
  catch (e) { S.citems = []; S.itemsErr = e; }
  if (S.cv === id) { S.scrollDown = true; render(); }
}

async function moreFeed() {
  const first = S.citems && S.citems[0]; if (!first) return;
  try {
    const j = await api("feed", { chat_id: S.cv, before_id: first.id });
    S.citems = [...(j.items || []), ...S.citems]; S.hasMore = !!j.has_more; render();
  } catch (e) { toast(errText(e)); }
}

async function copyText(t) {
  try { await navigator.clipboard.writeText(t); }
  catch (_) {
    const a = document.createElement("textarea"); a.value = t; a.style.position = "fixed"; a.style.opacity = "0";
    document.body.appendChild(a); a.select(); try { document.execCommand("copy"); } catch (_) {} a.remove();
  }
  buzz(); toast("Скопійовано");
}

async function loadAI() {
  try { const j = await api("assistant_history"); S.msgs = (j.messages || []).map((m) => ({ role: m.role, content: m.content })); }
  catch (e) { S.msgs = []; toast(errText(e)); }
  if (S.tab === "ai") { S.scrollDown = true; render(); }
}

function renderMsgs() {
  const el = $("#msgs"); if (!el) return;
  el.innerHTML = msgsHtml(); bindSugg();
  window.scrollTo(0, document.documentElement.scrollHeight);
}
function bindSugg() { document.querySelectorAll("[data-sg]").forEach((b) => b.onclick = () => sendAI(b.dataset.sg)); }

async function sendAI(text) {
  text = String(text || "").trim();
  if (!text || S.busy) return;
  if (S.msgs === null) S.msgs = [];
  S.msgs.push({ role: "user", content: text }); S.busy = true; renderMsgs();
  try {
    const j = await api("assistant_send", { text });
    S.msgs.push({ role: "assistant", content: j.reply || "Готово.", err: j.ok === false });
    if (j.events) S.events = j.events;
  } catch (e) { S.msgs.push({ role: "assistant", content: errText(e), err: true }); }
  S.busy = false; renderMsgs(); buzz();
}

function bindAI() {
  const f = $("#af"); if (!f) return;
  const t = $("#ai"), send = $(".send");
  const fit = () => { t.style.height = "auto"; t.style.height = Math.min(t.scrollHeight, 120) + "px"; };
  t.oninput = () => { S.draft = t.value; fit(); send.disabled = !t.value.trim() || S.busy; };
  t.onfocus = () => { document.body.classList.add("kb"); setTimeout(() => window.scrollTo(0, document.documentElement.scrollHeight), 250); };
  t.onblur = () => document.body.classList.remove("kb");
  send.onpointerdown = (e) => e.preventDefault(); // щоб клавіатура не зникала під час надсилання
  f.onsubmit = (e) => { e.preventDefault(); const v = t.value; t.value = ""; S.draft = ""; fit(); send.disabled = true; sendAI(v); };
  t.onkeydown = (e) => { if (e.key === "Enter" && !e.shiftKey && matchMedia("(pointer:fine)").matches) { e.preventDefault(); f.requestSubmit(); } };
  const clr = $("[data-aclear]");
  if (clr) clr.onclick = () => {
    const go = async () => { try { await api("assistant_clear"); S.msgs = []; render(); toast("Розмову очищено"); } catch (e) { toast(errText(e)); } };
    if (tg && initData && tg.showConfirm) tg.showConfirm("Очистити розмову з асистентом? Події календаря не зміняться.", (ok) => ok && go()); else if (confirm("Очистити розмову?")) go();
  };
  bindSugg(); fit(); send.disabled = !t.value.trim() || S.busy;
}

function debounce(fn, ms) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; }

// ---------- демо-режим (без Telegram): сторінка/#demo ----------
function demoApi(action, body) {
  const now = Date.now();
  const mk = (id, title, dh, dur, status, extra = {}) => ({ id, title, start_at: new Date(now + dh * 3600e3).toISOString(), end_at: new Date(now + (dh * 60 + dur) * 60e3).toISOString(), notes: null, source_name: null, remind_min: 30, status, ...extra });
  window.__demo ||= {
    events: [mk(1, "Сніданок із Катею", -3, 60, "confirmed", { source_name: "Катя" }), mk(2, "Дзвінок щодо проєкту", 2, 45, "confirmed", { notes: "Підготувати кошторис" }), mk(3, "Кіно", 5, 120, "confirmed", { source_name: "Катя", remind_min: 60 }), mk(4, "Прогулянка в парку", 27, 90, "pending", { source_name: "Оля" })],
    chats: [{ chat_id: 5, name: "Катя", flirt: true, mood: true }, { chat_id: 6, name: "Оля", flirt: false, mood: true }, { chat_id: 7, name: "Дмитро", flirt: false, mood: false }],
  };
  const D = window.__demo;
  const ago = (min, extra) => ({ at: new Date(now - min * 60e3).toISOString(), ...extra });
  window.__demo.feed ||= {
    5: [
      ago(1500, { id: 1, kind: "deleted", body: "Забудь, що я писала раніше", media_kind: null }),
      ago(1490, { id: 2, kind: "edited", quote: "Побачимось у п'ятницю?", body: "Побачимось у суботу?" }),
      ago(40, { id: 3, kind: "mood", quote: "[17.11 10:05] привіт, як ти?\n[17.11 10:05] ходімо на каву?", body: "😊 Настрій: привітний і трохи грайливий.\n💓 Інтерес: 8/10, сама пропонує зустріч.\n💬 Флірт: помітний, з емодзі й ініціативою." }),
      ago(39, { id: 4, kind: "flirt", quote: "[17.11 10:05] привіт, як ти?\n[17.11 10:05] ходімо на каву?", body: "1) привіт) добре, а ти як? на каву з радістю\n2) привіт, ти якраз вчасно, саме думав про каву і про тебе\n3) з тобою навіть кава смачніша, коли йдемо?" }),
    ],
    6: [ago(300, { id: 5, kind: "mood", quote: "[17.11 06:00] ок", body: "😊 Настрій: нейтральний, стриманий.\n💓 Інтерес: 4/10, відповіді короткі." })],
  };
  window.__demo.ai ||= [{ role: "user", content: "Що в мене сьогодні?" }, { role: "assistant", content: "Сьогодні три події: дзвінок щодо проєкту о 12:50, кіно з Катею о 15:50 і вільний вечір. Можу запропонувати час для прогулянки." }];
  if (action === "init") return Promise.resolve({ tz: "Europe/Kyiv", ai: "Groq", editor: "Claude", hub: ["flirt"], events: D.events });
  if (action === "feed_chats") {
    const rows = D.chats.map((c) => { const f = D.feed[c.chat_id]; const l = f && f[f.length - 1]; return { ...c, last_kind: l ? l.kind : null, last_body: l ? l.body : "", last_at: l ? l.at : null, count: f ? f.length : 0 }; });
    rows.sort((a, b) => (b.last_at || "").localeCompare(a.last_at || ""));
    return Promise.resolve({ feed_ready: true, chats: rows });
  }
  if (action === "feed") return Promise.resolve({ has_more: false, items: D.feed[body.chat_id] || [] });
  if (action === "assistant_history") return Promise.resolve({ messages: D.ai });
  if (action === "assistant_send") return new Promise((r) => setTimeout(() => { const reply = "Це демо-відповідь. У справжньому застосунку тут відповідає ваш асистент."; D.ai.push({ role: "user", content: body.text }, { role: "assistant", content: reply }); r({ ok: true, reply, events: D.events }); }, 700));
  if (action === "assistant_clear") { D.ai = []; return Promise.resolve({ ok: true }); }
  if (action === "chats") return Promise.resolve({ chats: D.chats.filter((c) => c.name.toLowerCase().includes((body.q || "").toLowerCase())) });
  if (action === "event_delete") D.events = D.events.filter((e) => e.id !== body.id);
  if (action === "event_status") D.events = D.events.map((e) => (e.id === body.id ? { ...e, status: body.status } : e)).filter((e) => e.status !== "dismissed");
  if (action === "event_add") D.events.push({ id: Date.now(), title: body.title, start_at: new Date(body.start + "+02:00").toISOString(), end_at: new Date(new Date(body.start + "+02:00").getTime() + body.duration_min * 60e3).toISOString(), notes: body.notes || null, source_name: "Застосунок", remind_min: body.remind_min, status: "confirmed" });
  return Promise.resolve({ ok: true, events: D.events });
}

// ---------- старт ----------
function applyTheme() {
  if (!tg || !initData) { syncThemeColor(); return; }
  const light = tg.colorScheme === "light";
  document.documentElement.dataset.theme = light ? "light" : "dark";
  const bg = getComputedStyle(document.documentElement).getPropertyValue("--bg").trim();
  try { tg.setHeaderColor(bg); tg.setBackgroundColor(bg); } catch (_) {}
}

function syncThemeColor() {
  const bg = getComputedStyle(document.documentElement).getPropertyValue("--bg").trim();
  const m = document.querySelector('meta[name="theme-color"]'); if (m && bg) m.setAttribute("content", bg);
}

// ---------- вхід за кодом (iPhone / браузер) ----------
function showLogin(msg) {
  const app = $("#app");
  app.innerHTML = `<div class="login"><h1>Вхід</h1><p>Введіть код доступу з Supabase (секрет <b>APP_KEY</b>). Він зберігається лише на цьому пристрої.</p>
    <input id="lk" type="password" placeholder="Код доступу" autocomplete="current-password" autocapitalize="off" autocorrect="off" aria-label="Код доступу">
    <div class="err" id="lerr">${esc(msg || "")}</div><button class="btn" id="lgo">Увійти</button></div>`;
  const go = () => { const v = $("#lk").value.trim(); if (!v) { $("#lerr").textContent = "Введіть код."; return; } setKey(v); start(); };
  $("#lgo").onclick = go; $("#lk").onkeydown = (e) => { if (e.key === "Enter") go(); };
}
function logout() { setKey(""); S.push = { sub: null }; showLogin(); }

// ---------- push-сповіщення (iPhone: iOS 16.4+, застосунок на головному екрані) ----------
const pushOk = () => !initData && "serviceWorker" in navigator && "PushManager" in window && "Notification" in window;
const b64ToU8 = (b) => { const p = "=".repeat((4 - b.length % 4) % 4), r = atob((b + p).replace(/-/g, "+").replace(/_/g, "/")); return Uint8Array.from(r, (c) => c.charCodeAt(0)); };
async function pushState() {
  if (!pushOk()) return;
  try { const reg = await navigator.serviceWorker.ready; const sub = await reg.pushManager.getSubscription(); S.push = { sub: !!sub && Notification.permission === "granted" }; }
  catch (_) { S.push = { sub: false }; }
  if (S.tab === "bot") render();
}
function pushBlock() {
  let body;
  if (initData) body = `<p class="note">Сповіщення на iPhone вмикаються в застосунку з головного екрана (не в Telegram).</p>`;
  else if (!pushOk()) body = `<p class="note">Щоб отримувати сповіщення, додайте застосунок на головний екран: Safari → «Поділитися» → «На екран "Додому"», потім відкрийте його з іконки (потрібен iOS 16.4 або новіший).</p>`;
  else if (S.push && S.push.sub) body = `<div class="stat"><span>Сповіщення</span><span>увімкнено</span></div><div class="acts"><button class="btn" data-push="test">Надіслати тест</button><button class="btn ghost" data-push="off">Вимкнути</button></div>`;
  else body = `<div class="acts"><button class="btn" data-push="on">Увімкнути сповіщення</button></div><p class="note">Видалене, змінене, настрій, флірт, нові плани й нагадування приходитимуть на iPhone.</p>`;
  const out = !initData && getKey() ? `<div class="acts"><button class="btn ghost" data-push="logout">Вийти з цього пристрою</button></div>` : "";
  return `<section class="block pushbox" aria-label="Сповіщення">${body}${out}<p class="note">Версія застосунку: ${APP_VER}</p></section>`;
}
async function pushAction(a) {
  try {
    if (a === "logout") { if (confirm("Вийти? Код доведеться ввести знову.")) logout(); return; }
    const reg = await navigator.serviceWorker.ready;
    if (a === "on") {
      const perm = await Notification.requestPermission();
      if (perm !== "granted") { toast("Дозвольте сповіщення в Налаштуваннях iPhone"); return; }
      const { key } = await api("push_key");
      const old = await reg.pushManager.getSubscription(); if (old) await old.unsubscribe();
      const sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64ToU8(key) });
      await api("push_sub", { sub: sub.toJSON() });
      S.push = { sub: true }; buzz("medium"); render(); toast("Сповіщення увімкнено");
    } else if (a === "off") {
      const sub = await reg.pushManager.getSubscription();
      if (sub) { const ep = sub.endpoint; await sub.unsubscribe(); try { await api("push_unsub", { endpoint: ep }); } catch (_) {} }
      S.push = { sub: false }; render(); toast("Сповіщення вимкнено");
    } else if (a === "test") {
      const j = await api("push_test");
      toast(j.sent ? "Тест надіслано" : "Підписку не знайдено: увімкніть сповіщення знову");
    }
  } catch (e) { toast(errText(e)); }
}
document.addEventListener("click", (ev) => { const b = ev.target.closest("[data-push]"); if (b) pushAction(b.dataset.push); });
function goFromHash() {
  const m = /^#go=(cal|chats|ai|bot)(?::(-?\d+))?$/.exec(location.hash); if (!m) return;
  history.replaceState(null, "", location.pathname + location.search);
  if (m[1] === "chats" && m[2]) { S.tab = "chats"; openChat(+m[2]); } else goTab(m[1]);
}

async function start() {
  if (tg && initData) { tg.ready(); tg.expand(); applyTheme(); tg.onEvent && tg.onEvent("themeChanged", applyTheme); }
  else { syncThemeColor(); try { matchMedia("(prefers-color-scheme: dark)").addEventListener("change", syncThemeColor); } catch (_) {} }
  const app = $("#app");
  if (!initData && !DEMO) {
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("sw.js").catch(() => {});
      navigator.serviceWorker.addEventListener("message", (ev) => { if (ev.data && ev.data.go) { location.hash = "#go=" + ev.data.go; goFromHash(); } });
    }
    window.addEventListener("hashchange", () => { if (S.events && getKey()) goFromHash(); });
    if (!getKey()) { showLogin(); return; }
  }
  try {
    const j = await api("init");
    Object.assign(S, { tz: j.tz || S.tz, ai: j.ai, editor: !!j.editor, hub: j.hub || [], events: j.events || [] });
    S.sel = todayKey();
    render();
    if (!initData && !DEMO) { pushState(); goFromHash(); }
  } catch (e) {
    if (!initData && e.code === "auth") return;
    app.innerHTML = `<div class="fatal"><b>Не вдалося відкрити</b>${esc(errText(e))}</div>`;
  }
}
start();
