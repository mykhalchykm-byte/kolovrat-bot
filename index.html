<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0, viewport-fit=cover">
  <title>KOLOVRAT App</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: var(--tg-theme-bg-color, #ffffff);
      --text: var(--tg-theme-text-color, #000000);
      --hint: var(--tg-theme-hint-color, #8e8e93);
      --accent: var(--tg-theme-button-color, #ff80ab);
      --accent-text: var(--tg-theme-button-text-color, #ffffff);
      --card-bg: var(--tg-theme-secondary-bg-color, #f9f9f9);
      --border: rgba(0, 0, 0, 0.1);
    }

    [data-theme="dark"] {
      --border: rgba(255, 255, 255, 0.15);
      --card-bg: #1c1c1e;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      padding: 0;
      /* Відступ зверху зроблено ще більшим (+34px до безпечної зони iPhone) */
      padding-top: calc(env(safe-area-inset-top, 0px) + 34px);
      padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 20px);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      overscroll-behavior-y: none;
    }

    #app {
      padding: 0 16px 20px 16px;
      max-width: 600px;
      margin: 0 auto;
    }

    /* Навігація в стилі оригінального дизайну */
    .nav-tabs {
      display: flex;
      gap: 6px;
      margin-bottom: 16px;
      overflow-x: auto;
      padding-bottom: 4px;
    }

    .nav-btn {
      flex: 1;
      padding: 10px 8px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--card-bg);
      color: var(--text);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      text-align: center;
    }

    .nav-btn.active {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }

    /* Картки та елементи у вашому стилі */
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 12px;
    }

    .card-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 600;
      font-size: 15px;
    }

    .field {
      display: block;
      margin-bottom: 12px;
    }

    .field span {
      display: block;
      font-size: 12px;
      color: var(--hint);
      margin-bottom: 4px;
    }

    .opts {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .chip {
      padding: 8px 12px;
      border-radius: 15px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: 13px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .chip[aria-pressed="true"] {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }

    .inp {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
      box-sizing: border-box;
      outline: none;
    }

    .inp:focus {
      border-color: var(--accent);
    }

    .err {
      color: #ff3b30;
      font-size: 12px;
      margin-top: 6px;
    }

    .acts {
      display: flex;
      gap: 10px;
      margin-top: 16px;
    }

    .btn {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: var(--accent);
      color: white;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
    }

    .btn.ghost {
      background: rgba(0, 0, 0, 0.06);
      color: var(--text);
    }

    .btn.sm {
      padding: 6px 12px;
      font-size: 12px;
      border-radius: 8px;
    }

    /* Модальне вікно створення події */
    .sheet-wrap {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.4);
      z-index: 200;
      display: flex;
      align-items: flex-end;
    }

    .sheet-inner {
      width: 100%;
      background: var(--bg);
      border-top-left-radius: 20px;
      border-top-right-radius: 20px;
      padding: 20px 16px calc(env(safe-area-inset-bottom, 0px) + 20px);
      max-height: 90vh;
      overflow-y: auto;
    }

    /* Чат з Асистентом */
    .chat-box {
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-height: 280px;
      max-height: calc(100vh - 230px);
      overflow-y: auto;
      margin-bottom: 12px;
    }

    .msg {
      max-width: 85%;
      padding: 10px 14px;
      border-radius: 14px;
      font-size: 14px;
      line-height: 1.4;
    }

    .msg.user {
      align-self: flex-end;
      background: var(--accent);
      color: white;
    }

    .msg.bot {
      align-self: flex-start;
      background: var(--card-bg);
      border: 1px solid var(--border);
    }

    .fatal {
      padding: 40px 20px;
      text-align: center;
      color: var(--hint);
    }
  </style>
</head>
<body>

<div id="app"></div>

<script>
const tg = window.Telegram.WebApp;
const initData = tg.initData;
const DEMO = !initData && window.location.hash === "#demo";

const $ = (s) => document.querySelector(s);
const S = {
  tab: "cal",
  sel: todayKey(),
  openId: null,
  sheet: false,
  chats: null,
  events: [],
  deletedMsgs: [],
  assistantLog: [{ role: "bot", text: "Привіт! Я твій помічник. Напиши мені питання або прохання щось запланувати." }],
  q: "",
  loading: false
};

async function api(action, body = {}) {
  if (DEMO) return demoApi(action, body);
  const r = await fetch("/api", {
    method: "POST",
    headers: { "x-init-data": initData, "content-type": "application/json" },
    body: JSON.stringify({ action, ...body }),
  });
  const j = await r.json();
  if (!r.ok) throw new Error(j.message || j.error || "Помилка сервера");
  return j;
}

function errText(e) { return e.message || String(e); }
function buzz(type = "light") { try { tg.HapticFeedback.impactOccurred(type); } catch(_) {} }
function todayKey() { return new Date().toISOString().split("T")[0]; }
function addDays(d, n) { const date = new Date(d); date.setDate(date.getDate() + n); return date.toISOString().split("T")[0]; }
function remLabel(m) { return m >= 1440 ? (m/1440) + " дн" : (m >= 60 ? (m/60) + " год" : m + " хв"); }
function esc(s) { return String(s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }

function render() {
  const app = $("#app");

  if (S.sheet) {
    app.innerHTML = `
      <div class="sheet-wrap">
        <div class="sheet-inner">
          <div style="font-weight:600; font-size:16px; margin-bottom:14px">Додати подію</div>
          <form id="f">
            <label class="field"><span>Назва</span><input class="inp" name="title" required placeholder="Наприклад: Зустріч"></label>
            <div style="display:flex; gap:10px">
              <label class="field" style="flex:1"><span>Дата</span><input class="inp" type="date" name="date" value="${S.sel}" required></label>
              <label class="field" style="flex:1"><span>Час</span><input class="inp" type="time" name="time" value="12:00" required></label>
            </div>
            <div class="field">
              <span>Тривалість</span>
              <div class="opts" data-group="dur">
                ${[30, 60, 90, 120].map((m, i) => `<button type="button" class="chip" data-v="${m}" aria-pressed="${i===1}">${m} хв</button>`).join("")}
              </div>
            </div>
            <div class="field">
              <span>Нагадати</span>
              <div class="opts" data-group="rem">
                ${[10, 30, 60, 1440].map((m, i) => `<button type="button" class="chip" data-v="${m}" aria-pressed="${i===1}">${remLabel(m)}</button>`).join("")}
              </div>
            </div>
            <label class="field"><span>Нотатка</span><textarea class="inp" name="notes" maxlength="500" placeholder="Місце, деталі"></textarea></label>
            <div class="err" id="err" role="alert"></div>
            <div class="acts">
              <button type="button" class="btn ghost" data-cancel>Скасувати</button>
              <button class="btn" type="submit">Зберегти</button>
            </div>
          </form>
        </div>
      </div>`;
    bindSheet();
    return;
  }

  app.innerHTML = `
    <div class="nav-tabs">
      <button class="nav-btn ${S.tab==='cal'?'active':''}" data-tab="cal">📅 Календар</button>
      <button class="nav-btn ${S.tab==='bot'?'active':''}" data-tab="bot">💬 Чати</button>
      <button class="nav-btn ${S.tab==='deleted'?'active':''}" data-tab="deleted">🗑 Видалені</button>
      <button class="nav-btn ${S.tab==='assistant'?'active':''}" data-tab="assistant">🤖 Асистент</button>
    </div>

    ${S.tab === 'cal' ? `
      <div class="card" style="display:flex; justify-content:space-between; align-items:center;">
        <button class="chip" data-wk="-1">&lt;</button>
        <b>${S.sel}</b>
        <button class="chip" data-wk="1">&gt;</button>
      </div>
      <div>
        ${S.events.filter(e => e.start_at.startsWith(S.sel)).map(e => `
          <div class="card">
            <div class="card-head">
              <span>📌 ${esc(e.title)}</span>
              <span style="font-size:12px; color:var(--hint)">${e.start_at.slice(11,16)}</span>
            </div>
            ${e.notes ? `<div style="font-size:13px; color:var(--hint); margin-top:6px">${esc(e.notes)}</div>` : ''}
            <div style="margin-top:10px">
              <button class="btn sm ghost" data-del="${e.id}">Видалити</button>
            </div>
          </div>
        `).join('') || `
          <div class="card" style="text-align:center; padding:24px; color:var(--hint)">
            Вільний день. Додайте подію або напишіть про неї в чаті.
          </div>
        `}
      </div>
      <button class="btn" data-add>+ Додати подію</button>
    ` : ''}

    ${S.tab === 'bot' ? `
      <input id="q" class="inp" style="margin-bottom:12px" placeholder="Пошук людей за іменем..." value="${esc(S.q)}">
      <div>
        ${(S.chats || []).length ? S.chats.map(c => `
          <div class="card">
            <div class="card-head"><span>👤 ${esc(c.name)}</span></div>
            <div class="opts" style="margin-top:10px">
              <button class="chip" data-t="flirt" data-id="${c.chat_id}" aria-pressed="${c.flirt}">💬 Флірт</button>
              <button class="chip" data-t="mood" data-id="${c.chat_id}" aria-pressed="${c.mood}">📊 Настрій</button>
            </div>
          </div>
        `).join('') : '<div class="card" style="text-align:center; color:var(--hint)">Чати не знайдено</div>'}
      </div>
    ` : ''}

    ${S.tab === 'deleted' ? `
      <div style="font-size:13px; color:var(--hint); margin-bottom:10px">Збережені видалені та змінені повідомлення:</div>
      <div>
        ${S.deletedMsgs.length ? S.deletedMsgs.map(m => `
          <div class="card">
            <div class="card-head">
              <span>${esc(m.sender_name)}</span>
              <span style="font-size:11px; color:var(--hint)">${m.date || ''}</span>
            </div>
            <div style="margin-top:6px; font-size:14px">${esc(m.text || '[Медіафайл]')}</div>
          </div>
        `).join('') : '<div class="card" style="text-align:center; color:var(--hint)">Немає видалених повідомлень</div>'}
      </div>
    ` : ''}

    ${S.tab === 'assistant' ? `
      <div class="chat-box" id="cbox">
        ${S.assistantLog.map(m => `<div class="msg ${m.role}">${esc(m.text)}</div>`).join('')}
      </div>
      <div style="display:flex; gap:8px">
        <input class="inp" id="amsg" placeholder="Запитайте асистента..." style="margin:0">
        <button class="btn" id="asend" style="width:auto; padding:0 18px">Надіслати</button>
      </div>
    ` : ''}
  `;

  bind();
}

function bind() {
  document.querySelectorAll("[data-tab]").forEach(b => {
    b.onclick = () => {
      S.tab = b.dataset.tab;
      buzz();
      if (S.tab === "bot" && !S.chats) loadChats();
      if (S.tab === "deleted" && !S.deletedMsgs.length) loadDeleted();
      render();
    };
  });

  if (S.tab === "cal") {
    const add = $("[data-add]");
    if (add) add.onclick = () => { S.sheet = true; render(); };
    document.querySelectorAll("[data-wk]").forEach(b => b.onclick = () => {
      S.sel = addDays(S.sel, 1 * (+b.dataset.wk));
      render();
    });
    document.querySelectorAll("[data-del]").forEach(b => b.onclick = () => mutate("event_delete", { id: +b.dataset.del }));
  }

  if (S.tab === "bot") {
    const q = $("#q");
    if (q) q.oninput = debounce(() => { S.q = q.value; loadChats(); }, 350);
    document.querySelectorAll(".chip[data-t]").forEach(b => b.onclick = () => toggleChat(b));
  }

  if (S.tab === "assistant") {
    const cbox = $("#cbox");
    if (cbox) cbox.scrollTop = cbox.scrollHeight;
    const send = async () => {
      const inp = $("#amsg");
      const text = inp.value.trim();
      if (!text || S.loading) return;
      S.assistantLog.push({ role: "user", text });
      inp.value = "";
      S.loading = true;
      render();
      try {
        const j = await api("ask_assistant", { question: text });
        S.assistantLog.push({ role: "bot", text: j.answer || "Готово." });
      } catch (e) {
        S.assistantLog.push({ role: "bot", text: "⚠️ " + errText(e) });
      } finally {
        S.loading = false;
        render();
      }
    };
    const btn = $("#asend");
    if (btn) btn.onclick = send;
    const inp = $("#amsg");
    if (inp) inp.onkeydown = (e) => e.key === "Enter" && send();
  }
}

function bindSheet() {
  document.querySelectorAll("[data-cancel]").forEach(b => b.onclick = () => { S.sheet = false; render(); });
  document.querySelectorAll(".sheet-inner .sheet-wrap").forEach(w => w.onclick = (e) => {
    if (e.target.classList.contains("sheet-wrap")) { S.sheet = false; render(); }
  });
  document.querySelectorAll(".opts .chip").forEach(b => b.onclick = () => {
    b.parentElement.querySelectorAll(".chip").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
  });
  const form = $("#f");
  if (form) {
    form.onsubmit = async (e) => {
      e.preventDefault();
      const f = e.target;
      const v = (g) => +f.querySelector(`[data-group=${g}] [aria-pressed=true]`).dataset.v;
      try {
        const j = await api("event_add", {
          title: f.title.value.trim(),
          start: `${f.date.value}T${f.time.value}`,
          duration_min: v("dur"),
          remind_min: v("rem"),
          notes: f.notes.value.trim()
        });
        S.events = j.events || S.events;
        S.sel = f.date.value;
        S.sheet = false;
        buzz("medium");
        render();
      } catch (err) {
        $("#err").textContent = errText(err);
      }
    };
  }
}

async function mutate(action, body) {
  try {
    const j = await api(action, body);
    S.events = j.events || S.events;
    buzz("medium");
    render();
  } catch (e) {
    alert(errText(e));
  }
}

async function toggleChat(btn) {
  const kind = btn.dataset.t, id = +btn.dataset.id;
  const c = S.chats.find(x => x.chat_id === id);
  if (!c) return;
  const next = !c[kind];
  c[kind] = next;
  btn.setAttribute("aria-pressed", String(next));
  buzz();
  try {
    await api("toggle", { kind, chat_id: id, enabled: next });
  } catch (e) {
    c[kind] = !next;
    btn.setAttribute("aria-pressed", String(!next));
  }
}

async function loadChats() {
  try {
    const j = await api("chats", { q: S.q });
    S.chats = j.chats || [];
    if (S.tab === "bot") render();
  } catch (e) { S.chats = []; }
}

async function loadDeleted() {
  try {
    const j = await api("deleted_messages");
    S.deletedMsgs = j.messages || [];
    if (S.tab === "deleted") render();
  } catch (e) { S.deletedMsgs = []; }
}

function debounce(fn, ms) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; }

function demoApi(action, body) {
  if (action === "init") return Promise.resolve({ tz: "Europe/Kyiv", events: [] });
  if (action === "chats") return Promise.resolve({ chats: [{ chat_id: 1, name: "Катя", flirt: true, mood: true }] });
  if (action === "deleted_messages") return Promise.resolve({ messages: [{ sender_name: "Катя", text: "Зустрінемось завтра", date: "12:00" }] });
  if (action === "ask_assistant") return Promise.resolve({ answer: "Готово, я відповів!" });
  return Promise.resolve({ ok: true, events: [] });
}

async function start() {
  if (tg) {
    tg.ready();
    tg.expand();
    const light = tg.colorScheme === "light";
    document.documentElement.dataset.theme = light ? "light" : "dark";
  }

  if (!initData && !DEMO) {
    $("#app").innerHTML = `<div class="fatal"><b>Відкрийте застосунок з Telegram</b><br><br>Напишіть боту <code>/app</code></div>`;
    return;
  }

  try {
    const j = await api("init");
    S.events = j.events || [];
    render();
  } catch (e) {
    $("#app").innerHTML = `<div class="fatal"><b>Не вдалося відкрити</b><br>${esc(errText(e))}</div>`;
  }
}

start();
</script>
</body>
</html>
