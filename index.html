<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0, viewport-fit=cover">
  <title>KOLOVRAT BOT</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #f8f8fa;
      --card-bg: #ffffff;
      --accent: #8e24aa;
      --accent-light: #f3e5f5;
      --text: #1c1c1e;
      --text-sec: #8e8e93;
      --border: #e5e5ea;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    [data-theme="dark"] {
      --bg: #000000;
      --card-bg: #1c1c1e;
      --text: #ffffff;
      --text-sec: #8e8e93;
      --border: #2c2c2e;
      --accent-light: #3a1c40;
    }

    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
      overscroll-behavior: none;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    /* Відступ під виріз iPhone */
    #app {
      padding-top: max(var(--safe-top), 20px);
      padding-bottom: calc(80px + var(--safe-bottom));
      padding-left: 16px;
      padding-right: 16px;
      min-height: 100vh;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      padding-top: 4px;
    }

    .date-big {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .date-big .num {
      font-size: 38px;
      font-weight: 800;
      line-height: 1;
      color: var(--text);
    }

    .date-big .meta {
      display: flex;
      flex-direction: column;
    }

    .date-big .weekday {
      font-size: 18px;
      font-weight: 700;
      color: var(--text);
    }

    .date-big .month {
      font-size: 13px;
      color: var(--text-sec);
    }

    .btn-add {
      background: var(--accent);
      color: #ffffff;
      border: none;
      padding: 10px 18px;
      border-radius: 20px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(142, 36, 170, 0.3);
    }

    .btn-add:active {
      transform: scale(0.96);
    }

    .week-strip {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      margin-bottom: 16px;
    }

    .days-list {
      display: flex;
      gap: 6px;
      flex: 1;
      justify-content: space-between;
    }

    .day-chip {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 8px 4px;
      background: var(--card-bg);
      border-radius: 12px;
      border: 1px solid var(--border);
      color: var(--text);
      cursor: pointer;
    }

    .day-chip .w {
      font-size: 11px;
      color: var(--text-sec);
      margin-bottom: 2px;
    }

    .day-chip .d {
      font-size: 15px;
      font-weight: 700;
    }

    .day-chip.active {
      background: var(--accent);
      color: #ffffff;
      border-color: var(--accent);
    }

    .day-chip.active .w {
      color: rgba(255, 255, 255, 0.8);
    }

    .nav-btn {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 10px;
      padding: 8px 10px;
      font-size: 14px;
      cursor: pointer;
    }

    .content-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .empty-card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 24px;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.03);
      margin-top: 10px;
    }

    .empty-card b {
      font-size: 17px;
      display: block;
      margin-bottom: 8px;
    }

    .empty-card p {
      margin: 0;
      font-size: 14px;
      color: var(--text-sec);
      line-height: 1.4;
    }

    .ev-card {
      background: var(--card-bg);
      border-radius: 14px;
      padding: 14px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.04);
      display: flex;
      flex-direction: column;
      gap: 6px;
      cursor: pointer;
    }

    .ev-card.pending {
      border-left: 4px solid var(--accent);
    }

    .ev-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .ev-title {
      font-weight: 700;
      font-size: 15px;
    }

    .ev-time {
      font-size: 13px;
      color: var(--text-sec);
      font-weight: 600;
    }

    .ev-notes {
      font-size: 13px;
      color: var(--text-sec);
    }

    .ev-src {
      font-size: 11px;
      color: var(--accent);
      font-weight: 600;
    }

    .ev-actions {
      display: flex;
      gap: 8px;
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid var(--border);
    }

    .btn {
      padding: 10px 16px;
      border-radius: 10px;
      border: none;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      background: var(--accent);
      color: #ffffff;
    }

    .btn.ghost {
      background: var(--bg);
      color: var(--text);
    }

    .btn.danger {
      background: #ffebee;
      color: #c62828;
    }

    .btn.sm {
      padding: 6px 12px;
      font-size: 12px;
      border-radius: 8px;
    }

    .bottom-nav {
      position: fixed;
      bottom: calc(12px + var(--safe-bottom));
      left: 16px;
      right: 16px;
      background: var(--card-bg);
      border-radius: 30px;
      padding: 5px;
      display: flex;
      box-shadow: 0 4px 20px rgba(0,0,0,0.12);
      z-index: 90;
    }

    .nav-tab {
      flex: 1;
      padding: 10px;
      border: none;
      background: none;
      border-radius: 25px;
      font-size: 14px;
      font-weight: 700;
      color: var(--text-sec);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .nav-tab.active {
      background: var(--accent-light);
      color: var(--accent);
    }

    /* Модальне вікно (Sheet) */
    .sheet-wrap {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(4px);
      z-index: 100;
      display: flex;
      align-items: flex-end;
    }

    .sheet {
      background: var(--card-bg);
      width: 100%;
      border-radius: 24px 24px 0 0;
      padding: 20px;
      padding-bottom: calc(24px + var(--safe-bottom));
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-height: 85vh;
      overflow-y: auto;
    }

    .sheet-title {
      font-size: 18px;
      font-weight: 800;
      margin-bottom: 4px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .field span {
      font-size: 13px;
      color: var(--text-sec);
      font-weight: 600;
    }

    .inp {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      color: var(--text);
      font-size: 15px;
      outline: none;
      box-sizing: border-box;
    }

    .opts {
      display: flex;
      gap: 6px;
    }

    .chip {
      flex: 1;
      padding: 8px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
    }

    .chip[aria-pressed="true"] {
      background: var(--accent);
      color: #ffffff;
      border-color: var(--accent);
    }

    .row {
      display: flex;
      gap: 10px;
    }

    .row .field {
      flex: 1;
    }

    .acts {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }

    .err {
      color: #d32f2f;
      font-size: 13px;
    }

    .chat-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .chat-item {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .chat-name {
      font-weight: 600;
      font-size: 14px;
    }

    .chat-opts {
      display: flex;
      gap: 6px;
    }

    .fatal {
      padding: 40px 20px;
      text-align: center;
      color: var(--text-sec);
    }
  </style>
</head>
<body>

<div id="app"></div>

<script>
const tg = window.Telegram.WebApp;
const initData = tg ? tg.initData : "";
const DEMO = window.location.hash === "#demo";

const $ = (s) => document.querySelector(s);
const esc = (t) => String(t || '').replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

const S = {
  tab: "cal",
  sel: null,
  openId: null,
  sheet: false,
  chats: null,
  events: [],
  q: "",
  tz: "Europe/Kyiv"
};

// БЕЗПЕЧНИЙ ПАРСЕР ДАТ ДЛЯ SAFARI (iOS)
function parseYMD(str) {
  if (!str) return new Date();
  const parts = str.split('-');
  return new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
}

function formatDateKey(dt) {
  const y = dt.getFullYear();
  const m = String(dt.getMonth() + 1).padStart(2, '0');
  const d = String(dt.getDate()).padStart(2, '0');
  return `${y}-${m}-${d}`;
}

function todayKey() {
  return formatDateKey(new Date());
}

function addDays(dStr, n) {
  const dt = parseYMD(dStr);
  dt.setDate(dt.getDate() + n);
  return formatDateKey(dt);
}

function remLabel(m) {
  if (m >= 1440) return (m / 1440) + " дн";
  if (m >= 60) return (m / 60) + " год";
  return m + " хв";
}

async function api(action, body = {}) {
  if (DEMO) return demoApi(action, body);
  const r = await fetch("/api", {
    method: "POST",
    headers: { "x-init-data": initData, "content-type": "application/json" },
    body: JSON.stringify({ action, ...body }),
  });
  const j = await r.json();
  if (!r.ok) throw new Error(j.message || j.error || "Помилка сервера");
  return j;
}

function errText(e) { return e.message || String(e); }
function toast(m) { if (tg.showAlert) tg.showAlert(m); else alert(m); }
function buzz(t = "light") { if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred(t); }

function render() {
  const app = $("#app");
  if (S.sheet) {
    app.innerHTML = `<div class="sheet-wrap"><form id="f" class="sheet">
      <div class="sheet-title">Нова подія</div>
      <label class="field"><span>Назва</span><input class="inp" name="title" placeholder="Що плануємо?" required></label>
      <div class="row">
        <label class="field"><span>Дата</span><input class="inp" type="date" name="date" value="${S.sel}" required></label>
        <label class="field"><span>Час</span><input class="inp" type="time" name="time" value="12:00" required></label>
      </div>
      <div class="field"><span>Тривалість</span><div class="opts" data-group="dur">${[30, 60, 90, 120].map((m, i) => `<button type="button" class="chip" data-v="${m}" aria-pressed="${i === 1}">${m} хв</button>`).join("")}</div></div>
      <div class="field"><span>Нагадати</span><div class="opts" data-group="rem">${[10, 30, 60, 1440].map((m, i) => `<button type="button" class="chip" data-v="${m}" aria-pressed="${i === 1}">${remLabel(m)}</button>`).join("")}</div></div>
      <label class="field"><span>Нотатка</span><textarea class="inp" name="notes" maxlength="500" placeholder="Місце, деталі"></textarea></label>
      <div class="err" id="err" role="alert"></div>
      <div class="acts"><button type="button" class="btn ghost" data-cancel>Скасувати</button><button class="btn" type="submit">Додати подію</button></div></form></div>`;
  } else if (S.tab === "cal") {
    const evs = (S.events || []).filter(e => e.start_at && e.start_at.startsWith(S.sel) && e.status !== 'dismissed');
    const selDate = parseYMD(S.sel);
    const dayNum = selDate.getDate();
    const weekdayStr = selDate.toLocaleDateString('uk-UA', { weekday: 'long' });
    const monthYearStr = selDate.toLocaleDateString('uk-UA', { month: 'long', year: 'numeric' });

    const curr = parseYMD(S.sel);
    const dayOfWeek = (curr.getDay() + 6) % 7;
    const monday = new Date(curr);
    monday.setDate(curr.getDate() - dayOfWeek);

    const weekDays = [];
    const wNames = ['пн', 'вт', 'ср', 'чт', 'пт', 'сб', 'нд'];
    for (let i = 0; i < 7; i++) {
      const d = new Date(monday);
      d.setDate(monday.getDate() + i);
      const key = formatDateKey(d);
      weekDays.push({ key, day: d.getDate(), w: wNames[i] });
    }

    app.innerHTML = `
      <div class="header">
        <div class="date-big">
          <span class="num">${dayNum}</span>
          <div class="meta">
            <div class="weekday">${weekdayStr.charAt(0).toUpperCase() + weekdayStr.slice(1)}</div>
            <div class="month">${monthYearStr}</div>
          </div>
        </div>
        <button class="btn-add" data-add>+ Додати</button>
      </div>

      <div class="week-strip">
        <button class="nav-btn" data-wk="-1">&lt;</button>
        <div class="days-list">
          ${weekDays.map(d => `
            <button class="day-chip ${d.key === S.sel ? 'active' : ''}" data-day="${d.key}">
              <span class="w">${d.w}</span>
              <span class="d">${d.day}</span>
            </button>
          `).join('')}
        </div>
        <button class="nav-btn" data-wk="1">&gt;</button>
      </div>

      <div class="content-area">
        ${evs.length ? evs.map(e => `
          <div class="ev-card ${e.status === 'pending' ? 'pending' : ''}" data-ev="${e.id}">
            <div class="ev-head">
              <span class="ev-title">${esc(e.title)}</span>
              <span class="ev-time">${e.start_at.slice(11, 16)}</span>
            </div>
            ${e.notes ? `<div class="ev-notes">${esc(e.notes)}</div>` : ''}
            ${e.source_name ? `<div class="ev-src">з чату: ${esc(e.source_name)}</div>` : ''}
            ${S.openId === e.id ? `
              <div class="ev-actions">
                ${e.status === 'pending' ? `
                  <button class="btn sm" data-ok="${e.id}">✅ Додати</button>
                  <button class="btn sm ghost" data-no="${e.id}">❌ Пропустити</button>
                ` : ''}
                <button class="btn sm danger" data-del="${e.id}">🗑 Видалити</button>
              </div>
            ` : ''}
          </div>
        `).join('') : `
          <div class="empty-card">
            <b>Вільний день</b>
            <p>Додайте подію або напишіть про неї в чаті, бот сам її знайде.</p>
          </div>
        `}
      </div>

      <div class="bottom-nav">
        <button class="nav-tab active" data-tab="cal">📅 Календар</button>
        <button class="nav-tab" data-tab="bot">🤖 Бот</button>
      </div>
    `;
  } else {
    app.innerHTML = `
      <div class="header">
        <div class="date-big"><span class="weekday">Налаштування чатів</span></div>
      </div>
      <div class="field" style="margin-bottom:12px;">
        <input id="q" class="inp" placeholder="Пошук чату..." value="${esc(S.q)}">
      </div>
      <div class="content-area chat-list">
        ${(S.chats || []).length ? S.chats.map(c => `
          <div class="chat-item chat">
            <span class="chat-name">${esc(c.name)}</span>
            <div class="chat-opts">
              <button type="button" class="chip" data-t="flirt" data-id="${c.chat_id}" aria-pressed="${c.flirt}">💬 Флірт</button>
              <button type="button" class="chip" data-t="mood" data-id="${c.chat_id}" aria-pressed="${c.mood}">📊 Настрій</button>
            </div>
          </div>
        `).join('') : `<div class="empty-card"><p>${S.chats === null ? 'Завантаження...' : 'Нічого не знайдено'}</p></div>`}
      </div>
      <div class="bottom-nav">
        <button class="nav-tab" data-tab="cal">📅 Календар</button>
        <button class="nav-tab active" data-tab="bot">🤖 Бот</button>
      </div>
    `;
  }
  bind();
}

function bind() {
  document.querySelectorAll("[data-tab]").forEach((b) => b.onclick = () => { S.tab = b.dataset.tab; buzz(); render(); if (S.tab === "bot" && S.chats === null) loadChats(); });
  document.querySelectorAll("[data-day]").forEach((b) => b.onclick = () => { S.sel = b.dataset.day; S.openId = null; buzz(); render(); });
  document.querySelectorAll("[data-wk]").forEach((b) => b.onclick = () => { S.sel = addDays(S.sel, 7 * +b.dataset.wk); S.openId = null; render(); });
  document.querySelectorAll("[data-ev]").forEach((b) => b.onclick = () => {
    const id = +b.dataset.ev; S.openId = S.openId === id ? null : id; render();
  });
  document.querySelectorAll("[data-del]").forEach((b) => b.onclick = () => mutate("event_delete", { id: +b.dataset.del }, "Подію видалено"));
  document.querySelectorAll("[data-ok]").forEach((b) => b.onclick = () => mutate("event_status", { id: +b.dataset.ok, status: "confirmed" }, "Додано в календар"));
  document.querySelectorAll("[data-no]").forEach((b) => b.onclick = () => mutate("event_status", { id: +b.dataset.no, status: "dismissed" }, "Пропущено"));
  const add = $("[data-add]"); if (add) add.onclick = () => { S.sheet = true; render(); const t = $('input[name="title"]'); t && t.focus(); };
  document.querySelectorAll(".chat .chip").forEach((b) => b.onclick = () => toggleChat(b));
  const q = $("#q"); if (q) q.oninput = debounce(() => { S.q = q.value; loadChats(true); }, 350);
  if (S.sheet) bindSheet();
}

function bindSheet() {
  const close = () => { S.sheet = false; render(); };
  $("[data-cancel]").onclick = close;
  $(".sheet-wrap").onclick = (e) => { if (e.target.classList.contains("sheet-wrap")) close(); };
  document.querySelectorAll(".opts .chip").forEach((b) => b.onclick = () => {
    b.parentElement.querySelectorAll(".chip").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
  });
  $("#f").onsubmit = async (e) => {
    e.preventDefault();
    const f = e.target, v = (g) => +f.querySelector(`[data-group=${g}] [aria-pressed=true]`).dataset.v;
    const title = f.title.value.trim();
    if (!title) { $("#err").textContent = "Введіть назву події."; return; }
    const btn = f.querySelector("[type=submit]"); btn.disabled = true;
    try {
      const j = await api("event_add", { title, start: `${f.date.value}T${f.time.value}`, duration_min: v("dur"), remind_min: v("rem"), notes: f.notes.value.trim() });
      S.events = j.events; S.sel = f.date.value; S.sheet = false; buzz("medium"); render(); toast("Подію додано");
    } catch (err) { btn.disabled = false; $("#err").textContent = errText(err); }
  };
}

async function mutate(action, body, okText) {
  try { const j = await api(action, body); S.events = j.events; S.openId = null; buzz("medium"); render(); toast(okText); }
  catch (e) { toast(errText(e)); }
}

async function toggleChat(btn) {
  const kind = btn.dataset.t, id = +btn.dataset.id;
  const c = S.chats.find((x) => x.chat_id === id); if (!c) return;
  const next = !c[kind]; c[kind] = next; btn.setAttribute("aria-pressed", String(next)); buzz();
  try { await api("toggle", { kind, chat_id: id, enabled: next }); }
  catch (e) { c[kind] = !next; btn.setAttribute("aria-pressed", String(!next)); toast(errText(e)); }
}

async function loadChats(keepFocus) {
  try {
    const j = await api("chats", { q: S.q });
    S.chats = j.chats;
    if (S.tab === "bot") {
      const had = document.activeElement && document.activeElement.id === "q";
      const pos = had ? $("#q").selectionStart : 0;
      render();
      if (had) { const q = $("#q"); q.focus(); q.setSelectionRange(pos, pos); }
    }
  } catch (e) { S.chats = []; toast(errText(e)); if (S.tab === "bot") render(); }
}

function debounce(fn, ms) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; }

function demoApi(action, body) {
  const now = Date.now();
  const mk = (id, title, dh, dur, status, extra = {}) => ({ id, title, start_at: new Date(now + dh * 3600e3).toISOString(), end_at: new Date(now + (dh * 60 + dur) * 60e3).toISOString(), notes: null, source_name: null, remind_min: 30, status, ...extra });
  window.__demo ||= {
    events: [
      mk(1, "Сніданок із Катею", -3, 60, "confirmed", { source_name: "Катя" }),
      mk(2, "Дзвінок щодо проєкту", 2, 45, "confirmed", { notes: "Підготувати кошторис" }),
      mk(3, "Кіно", 5, 120, "confirmed", { source_name: "Катя", remind_min: 60 }),
      mk(4, "Прогулянка в парку", 27, 90, "pending", { source_name: "Оля" })
    ],
    chats: [
      { chat_id: 5, name: "Катя", flirt: true, mood: true },
      { chat_id: 6, name: "Оля", flirt: false, mood: true },
      { chat_id: 7, name: "Дмитро", flirt: false, mood: false }
    ],
  };
  const D = window.__demo;
  if (action === "init") return Promise.resolve({ tz: "Europe/Kyiv", ai: "Groq", editor: true, hub: ["flirt"], events: D.events });
  if (action === "chats") return Promise.resolve({ chats: D.chats.filter((c) => c.name.toLowerCase().includes((body.q || "").toLowerCase())) });
  if (action === "event_delete") D.events = D.events.filter((e) => e.id !== body.id);
  if (action === "event_status") D.events = D.events.map((e) => (e.id === body.id ? { ...e, status: body.status } : e)).filter((e) => e.status !== "dismissed");
  if (action === "event_add") D.events.push({ id: Date.now(), title: body.title, start_at: new Date(body.start + "+02:00").toISOString(), end_at: new Date(new Date(body.start + "+02:00").getTime() + body.duration_min * 60e3).toISOString(), notes: body.notes || null, source_name: "Застосунок", remind_min: body.remind_min, status: "confirmed" });
  return Promise.resolve({ ok: true, events: D.events });
}

function applyTheme() {
  if (!tg) return;
  const light = tg.colorScheme === "light";
  document.documentElement.dataset.theme = light ? "light" : "dark";
}

async function start() {
  if (tg) { tg.ready(); tg.expand(); applyTheme(); tg.onEvent && tg.onEvent("themeChanged", applyTheme); }
  const app = $("#app");
  if (!initData && !DEMO) {
    app.innerHTML = `<div class="fatal"><b>Відкрийте застосунок із Telegram</b><br><br>Натисніть кнопку «Застосунок» біля поля вводу в чаті з ботом або напишіть боту <code>/app</code>.</div>`;
    return;
  }
  try {
    const j = await api("init");
    Object.assign(S, { tz: j.tz || S.tz, ai: j.ai, editor: !!j.editor, hub: j.hub || [], events: j.events || [] });
    S.sel = todayKey();
    render();
  } catch (e) {
    app.innerHTML = `<div class="fatal"><b>Не вдалося відкрити</b><br><br><code>${esc(errText(e))}</code></div>`;
  }
}

start();
</script>
