<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0, viewport-fit=cover">
  <title>KOLOVRAT App</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      /* Збільшено відступ зверху (+ 32px), щоб програма була нижче від острівця iPhone */
      --safe-top: calc(env(safe-area-inset-top, 0px) + 32px);
      --safe-bottom: calc(env(safe-area-inset-bottom, 0px) + 12px);
      --bg: var(--tg-theme-bg-color, #ffffff);
      --text: var(--tg-theme-text-color, #000000);
      --hint: var(--tg-theme-hint-color, #8e8e93);
      --accent: #ff80ab;
      --card-bg: var(--tg-theme-secondary-bg-color, #f9f9f9);
      --border: rgba(0, 0, 0, 0.08);
    }

    [data-theme="dark"] {
      --border: rgba(255, 255, 255, 0.12);
      --card-bg: #1c1c1e;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      padding: 0;
      padding-top: var(--safe-top) !important;
      padding-bottom: var(--safe-bottom) !important;
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overscroll-behavior-y: none;
    }

    #app {
      padding-top: 10px;
      padding-left: 16px;
      padding-right: 16px;
      padding-bottom: 20px;
      max-width: 600px;
      margin: 0 auto;
    }

    /* Таби навігації */
    .tabs-bar {
      display: flex;
      gap: 6px;
      margin-bottom: 16px;
    }

    .tab-btn {
      flex: 1;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--card-bg);
      color: var(--text);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      text-align: center;
    }

    .tab-btn.active {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }

    /* Картки та форма */
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 12px;
    }

    .field {
      display: block;
      margin-bottom: 12px;
    }

    .field span {
      display: block;
      font-size: 12px;
      color: var(--hint);
      margin-bottom: 4px;
    }

    .opts {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .chip {
      padding: 8px 12px;
      border-radius: 15px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: 13px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .chip[aria-pressed="true"] {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }

    .inp {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
      box-sizing: border-box;
      outline: none;
    }

    .inp:focus {
      border-color: var(--accent);
    }

    .err {
      color: #ff3b30;
      font-size: 12px;
      margin-top: 6px;
    }

    .acts {
      display: flex;
      gap: 10px;
      margin-top: 16px;
    }

    .btn {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: var(--accent);
      color: white;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
    }

    .btn.ghost {
      background: rgba(0, 0, 0, 0.06);
      color: var(--text);
    }

    .btn.sm {
      padding: 6px 12px;
      font-size: 12px;
      border-radius: 8px;
    }

    /* Модальне вікно (sheet) */
    .sheet-wrap {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.4);
      z-index: 200;
      display: flex;
      align-items: flex-end;
    }

    .sheet-inner {
      width: 100%;
      background: var(--bg);
      border-top-left-radius: 20px;
      border-top-right-radius: 20px;
      padding: 20px 16px calc(env(safe-area-inset-bottom, 0px) + 20px);
      max-height: 90vh;
      overflow-y: auto;
    }

    .fatal {
      padding: 40px 20px;
      text-align: center;
      color: var(--hint);
    }
  </style>
</head>
<body>

<div id="app"></div>

<script>
const tg = window.Telegram.WebApp;
const initData = tg.initData;
const DEMO = !initData && window.location.hash === "#demo";

const $ = (s) => document.querySelector(s);
const S = { tab: "cal", sel: todayKey(), openId: null, sheet: false, chats: null, events: [], q: "" };

async function api(action, body = {}) {
  if (DEMO) return demoApi(action, body);
  const r = await fetch("/api", {
    method: "POST",
    headers: { "x-init-data": initData, "content-type": "application/json" },
    body: JSON.stringify({ action, ...body }),
  });
  const j = await r.json();
  if (!r.ok) throw new Error(j.message || j.error || "Помилка сервера");
  return j;
}

function errText(e) { return e.message || String(e); }
function toast(text) { try { tg.HapticFeedback.notificationOccurred("success"); } catch(_) {} }
function buzz(type = "light") { try { tg.HapticFeedback.impactOccurred(type); } catch(_) {} }
function todayKey() { return new Date().toISOString().split("T")[0]; }
function addDays(d, n) { const date = new Date(d); date.setDate(date.getDate() + n); return date.toISOString().split("T")[0]; }
function remLabel(m) { return m >= 1440 ? (m/1440) + " дн" : (m >= 60 ? (m/60) + " год" : m + " хв"); }
function esc(s) { return String(s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }

function render() {
  const app = $("#app");

  if (S.sheet) {
    app.innerHTML = `
      <div class="sheet-wrap">
        <div class="sheet-inner">
          <div style="font-weight:600; font-size:16px; margin-bottom:14px">Додати подію</div>
          <form id="f">
            <label class="field"><span>Назва</span><input class="inp" name="title" required placeholder="Наприклад: Зустріч"></label>
            <div style="display:flex; gap:10px">
              <label class="field" style="flex:1"><span>Дата</span><input class="inp" type="date" name="date" value="${S.sel}" required></label>
              <label class="field" style="flex:1"><span>Час</span><input class="inp" type="time" name="time" value="12:00" required></label>
            </div>
            <div class="field">
              <span>Тривалість</span>
              <div class="opts" data-group="dur">
                ${[30, 60, 90, 120].map((m, i) => `<button type="button" class="chip" data-v="${m}" aria-pressed="${i===1}">${m} хв</button>`).join("")}
              </div>
            </div>
            <div class="field">
              <span>Нагадати</span>
              <div class="opts" data-group="rem">
                ${[10, 30, 60, 1440].map((m, i) => `<button type="button" class="chip" data-v="${m}" aria-pressed="${i===1}">${remLabel(m)}</button>`).join("")}
              </div>
            </div>
            <label class="field"><span>Нотатка</span><textarea class="inp" name="notes" maxlength="500" placeholder="Місце, деталі"></textarea></label>
            <div class="err" id="err" role="alert"></div>
            <div class="acts">
              <button type="button" class="btn ghost" data-cancel>Скасувати</button>
              <button class="btn" type="submit">Додати подію</button>
            </div>
          </form>
        </div>
      </div>`;
    bindSheet();
    return;
  }

  app.innerHTML = `
    <div class="tabs-bar">
      <button class="tab-btn ${S.tab==='cal'?'active':''}" data-tab="cal">Календар</button>
      <button class="tab-btn ${S.tab==='bot'?'active':''}" data-tab="bot">Бот</button>
    </div>

    ${S.tab === 'cal' ? `
      <div class="card" style="display:flex; justify-content:space-between; align-items:center;">
        <button class="chip" data-wk="-1">&lt;</button>
        <b>${S.sel}</b>
        <button class="chip" data-wk="1">&gt;</button>
      </div>
      <div>
        ${S.events.filter(e => e.start_at.startsWith(S.sel)).map(e => `
          <div class="card">
            <div style="display:flex; justify-content:space-between; align-items:center; font-weight:600;">
              <span>📌 ${esc(e.title)}</span>
              <span style="font-size:12px; color:var(--hint)">${e.start_at.slice(11,16)}</span>
            </div>
            ${e.notes ? `<div style="font-size:13px; color:var(--hint); margin-top:6px">${esc(e.notes)}</div>` : ''}
            <div style="margin-top:10px">
              <button class="btn sm ghost" data-del="${e.id}">Видалити</button>
            </div>
          </div>
        `).join('') || `
          <div class="card" style="text-align:center; padding:24px; color:var(--hint)">
            <b>Вільний день</b><br>Додайте подію або напишіть про неї в чаті, бот сам її знайде.
          </div>
        `}
      </div>
      <button class="btn" data-add>+ Додати подію</button>
    ` : `
      <input id="q" class="inp" style="margin-bottom:12px" placeholder="Пошук людей за іменем..." value="${esc(S.q)}">
      <div>
        ${(S.chats || []).length ? S.chats.map(c => `
          <div class="card">
            <div style="font-weight:600">👤 ${esc(c.name)}</div>
            <div class="opts" style="margin-top:10px">
              <button class="chip" data-t="flirt" data-id="${c.chat_id}" aria-pressed="${c.flirt}">💬 Флірт</button>
              <button class="chip" data-t="mood" data-id="${c.chat_id}" aria-pressed="${c.mood}">📊 Настрій</button>
            </div>
          </div>
        `).join('') : '<div class="card" style="text-align:center; color:var(--hint)">Чати не знайдено</div>'}
      </div>
    `}
  `;

  bind();
}

function bind() {
  document.querySelectorAll("[data-tab]").forEach(b => {
    b.onclick = () => {
      S.tab = b.dataset.tab;
      buzz();
      render();
      if (S.tab === "bot" && S.chats === null) loadChats();
    };
  });

  if (S.tab === "cal") {
    const add = $("[data-add]");
    if (add) add.onclick = () => { S.sheet = true; render(); const t = $('input[name="title"]'); t && t.focus(); };
    document.querySelectorAll("[data-wk]").forEach(b => b.onclick = () => {
      S.sel = addDays(S.sel, 7 * (+b.dataset.wk));
      S.openId = null;
      render();
    });
    document.querySelectorAll("[data-del]").forEach(b => b.onclick = () => mutate("event_delete", { id: +b.dataset.del }, "Подію видалено"));
  }

  if (S.tab === "bot") {
    const q = $("#q");
    if (q) q.oninput = debounce(() => { S.q = q.value; loadChats(true); }, 350);
    document.querySelectorAll(".chip[data-t]").forEach(b => b.onclick = () => toggleChat(b));
  }
}

function bindSheet() {
  document.querySelectorAll("[data-cancel]").forEach(b => b.onclick = () => { S.sheet = false; render(); });
  const wrap = $(".sheet-wrap");
  if (wrap) {
    wrap.onclick = (e) => { if (e.target.classList.contains("sheet-wrap")) { S.sheet = false; render(); } };
  }
  document.querySelectorAll(".opts .chip").forEach(b => b.onclick = () => {
    b.parentElement.querySelectorAll(".chip").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
  });
  const form = $("#f");
  if (form) {
    form.onsubmit = async (e) => {
      e.preventDefault();
      const f = e.target;
      const v = (g) => +f.querySelector(`[data-group=${g}] [aria-pressed=true]`).dataset.v;
      const title = f.title.value.trim();
      if (!title) { $("#err").textContent = "Введіть назву події."; return; }
      const btn = f.querySelector("[type=submit]");
      btn.disabled = true;
      try {
        const j = await api("event_add", {
          title,
          start: `${f.date.value}T${f.time.value}`,
          duration_min: v("dur"),
          remind_min: v("rem"),
          notes: f.notes.value.trim()
        });
        S.events = j.events || S.events;
        S.sel = f.date.value;
        S.sheet = false;
        buzz("medium");
        render();
        toast("Подію додано");
      } catch (err) {
        btn.disabled = false;
        $("#err").textContent = errText(err);
      }
    };
  }
}

async function mutate(action, body, okText) {
  try {
    const j = await api(action, body);
    S.events = j.events || S.events;
    S.openId = null;
    buzz("medium");
    render();
    if (okText) toast(okText);
  } catch (e) {
    toast(errText(e));
  }
}

async function toggleChat(btn) {
  const kind = btn.dataset.t, id = +btn.dataset.id;
  const c = S.chats.find((x) => x.chat_id === id);
  if (!c) return;
  const next = !c[kind];
  c[kind] = next;
  btn.setAttribute("aria-pressed", String(next));
  buzz();
  try {
    await api("toggle", { kind, chat_id: id, enabled: next });
  } catch (e) {
    c[kind] = !next;
    btn.setAttribute("aria-pressed", String(!next));
    toast(errText(e));
  }
}

async function loadChats(keepFocus) {
  try {
    const j = await api("chats", { q: S.q });
    S.chats = j.chats || [];
    if (S.tab === "bot") {
      const had = document.activeElement && document.activeElement.id === "q";
      const pos = had ? $("#q").selectionStart : 0;
      render();
      if (had && keepFocus) {
        const q = $("#q");
        if (q) { q.focus(); q.setSelectionRange(pos, pos); }
      }
    }
  } catch (e) {
    S.chats = [];
    toast(errText(e));
    if (S.tab === "bot") render();
  }
}

function debounce(fn, ms) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; }

function demoApi(action, body) {
  const now = Date.now();
  const mk = (id, title, dh, dur, status, extra = {}) => ({
    id, title,
    start_at: new Date(now + dh * 3600e3).toISOString(),
    end_at: new Date(now + (dh * 60 + dur) * 60e3).toISOString(),
    notes: null, source_name: null, remind_min: 30, status, ...extra
  });
  window.__demo ||= {
    events: [
      mk(1, "Сніданок із Катею", -3, 60, "confirmed", { source_name: "Катя" }),
      mk(2, "Дзвінок щодо проєкту", 2, 45, "confirmed", { notes: "Підготувати кошторис" }),
      mk(3, "Кіно", 5, 120, "confirmed", { source_name: "Катя", remind_min: 60 })
    ],
    chats: [
      { chat_id: 5, name: "Катя", flirt: true, mood: true },
      { chat_id: 6, name: "Оля", flirt: false, mood: true }
    ],
  };
  const D = window.__demo;
  if (action === "init") return Promise.resolve({ tz: "Europe/Kyiv", events: D.events });
  if (action === "chats") return Promise.resolve({ chats: D.chats.filter((c) => c.name.toLowerCase().includes((body.q || "").toLowerCase())) });
  if (action === "event_delete") D.events = D.events.filter((e) => e.id !== body.id);
  if (action === "event_add") D.events.push({ id: Date.now(), title: body.title, start_at: new Date(body.start + "+02:00").toISOString(), end_at: new Date(new Date(body.start + "+02:00").getTime() + body.duration_min * 60e3).toISOString(), notes: body.notes || null, source_name: "Застосунок", remind_min: body.remind_min, status: "confirmed" });
  return Promise.resolve({ ok: true, events: D.events });
}

async function start() {
  if (tg) {
    tg.ready();
    tg.expand();
    const light = tg.colorScheme === "light";
    document.documentElement.dataset.theme = light ? "light" : "dark";
    const bg = getComputedStyle(document.documentElement).getPropertyValue("--bg").trim();
    try { tg.setHeaderColor(bg); tg.setBackgroundColor(bg); } catch (_) {}
  }

  const app = $("#app");
  if (!initData && !DEMO) {
    app.innerHTML = `<div class="fatal"><b>Відкрийте застосунок із Telegram</b><br><br>Натисніть кнопку «Застосунок» біля поля вводу в чаті з ботом або напишіть боту <code>/app</code>.</div>`;
    return;
  }

  try {
    const j = await api("init");
    Object.assign(S, { events: j.events || [] });
    S.sel = todayKey();
    render();
  } catch (e) {
    app.innerHTML = `<div class="fatal"><b>Не вдалося відкрити</b><br>${esc(errText(e))}</div>`;
  }
}

start();
</script>
</body>
</html>
