<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0, viewport-fit=cover">
  <title>KOLOVRAT BOT</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #ffffff;
      --bg-sec: #f4f4f7;
      --accent: #8e24aa; /* Фіолетовий колір як на скріншоті */
      --text: #000000;
      --text-sec: #757575;
      --safe-top: env(safe-area-inset-top);
      --safe-bottom: env(safe-area-inset-bottom);
    }

    [data-theme="dark"] {
      --bg: #1c1c1e;
      --bg-sec: #2c2c2e;
      --text: #ffffff;
      --text-sec: #a1a1a2;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior: none;
    }

    /* ФІКС ДЛЯ IPHONE (NOTCH) */
    #app {
      padding-top: var(--safe-top);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      box-sizing: border-box;
    }

    .header {
      padding: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .tabs {
      display: flex;
      background: var(--bg-sec);
      margin: 10px 16px;
      padding: 4px;
      border-radius: 12px;
      margin-top: auto; /* Притискаємо до низу */
      margin-bottom: calc(16px + var(--safe-bottom));
    }

    .tab {
      flex: 1;
      padding: 10px;
      border: none;
      background: none;
      color: var(--text-sec);
      font-weight: 600;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .tab.active {
      background: var(--bg);
      color: var(--accent);
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .btn {
      background: var(--accent);
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 15px;
    }

    .btn.ghost { background: var(--bg-sec); color: var(--text); }

    .sheet-wrap {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 100;
      display: flex;
      align-items: flex-end;
    }

    .sheet {
      background: var(--bg);
      width: 100%;
      border-radius: 20px 20px 0 0;
      padding: 20px;
      padding-bottom: calc(30px + var(--safe-bottom));
      box-sizing: border-box;
      max-height: 90vh;
      overflow-y: auto;
    }

    .field { display: block; margin-bottom: 16px; }
    .field span { display: block; font-size: 14px; color: var(--text-sec); margin-bottom: 6px; }
    .inp {
      width: 100%;
      background: var(--bg-sec);
      border: none;
      padding: 12px;
      border-radius: 10px;
      color: var(--text);
      box-sizing: border-box;
      font-size: 16px;
    }

    .chip {
      padding: 8px 16px;
      border-radius: 15px;
      background: var(--bg-sec);
      border: 1px solid transparent;
      color: var(--text);
      font-size: 14px;
    }

    .chip[aria-pressed="true"] {
      background: #fce4ec;
      border-color: var(--accent);
      color: var(--accent);
    }

    .opts { display: flex; gap: 8px; flex-wrap: wrap; }
    .acts { display: flex; gap: 12px; margin-top: 20px; }
    .fatal { padding: 40px; text-align: center; }
  </style>
</head>
<body>

<div id="app"></div>

<script>
const tg = window.Telegram.WebApp;
const initData = tg.initData;
const DEMO = window.location.hash === "#demo";

const $ = (s) => document.querySelector(s);
const esc = (t) => String(t).replace(/&/g, "&amp;").replace(/</g, "&lt;");

const S = {
  tab: "cal",
  sel: null,
  openId: null,
  sheet: false,
  chats: null,
  events: [],
  q: "",
  tz: "Europe/Kyiv"
};

async function api(action, body = {}) {
  if (DEMO) return demoApi(action, body);
  const r = await fetch("/api", {
    method: "POST",
    headers: { "x-init-data": initData, "content-type": "application/json" },
    body: JSON.stringify({ action, ...body }),
  });
  if (!r.ok) throw new Error("Помилка сервера");
  return r.json();
}

function todayKey() { return new Date().toLocaleString("sv-SE", {timeZone: S.tz}).slice(0, 10); }
function addDays(d, n) { 
  const date = new Date(d); 
  date.setDate(date.getDate() + n); 
  return date.toISOString().split("T")[0]; 
}
function remLabel(m) { 
  if (m < 60) return m + " хв";
  if (m < 1440) return (m/60) + " год";
  return (m/1440) + " дн";
}

function buzz(t = "light") { tg.HapticFeedback.impactOccurred(t); }
function toast(m) { tg.showAlert ? tg.showAlert(m) : alert(m); }
function errText(e) { return e.message || "Невідома помилка"; }

function render() {
  const app = $("#app");
  if (S.sheet) {
    app.innerHTML = `<div class="sheet-wrap"><form id="f" class="sheet">
    <label class="field"><span>Назва події</span><input class="inp" name="title" placeholder="Що плануємо?" autofocus></label>
    <div style="display:flex; gap:12px">
      <label class="field" style="flex:1"><span>Дата</span><input class="inp" type="date" name="date" value="${S.sel}"></label>
      <label class="field" style="flex:1"><span>Час</span><input class="inp" type="time" name="time" value="12:00"></label>
    </div>
    <div class="field"><span>Тривалість</span><div class="opts" data-group="dur">${[30, 60, 90, 120].map((m, i) => `<button type="button" class="chip" data-v="${m}" aria-pressed="${i === 1}">${m} хв</button>`).join("")}</div></div>
    <div class="field"><span>Нагадати</span><div class="opts" data-group="rem">${[10, 30, 60, 1440].map((m, i) => `<button type="button" class="chip" data-v="${m}" aria-pressed="${i === 1}">${remLabel(m)}</button>`).join("")}</div></div>
    <label class="field"><span>Нотатка</span><textarea class="inp" name="notes" maxlength="500" placeholder="Місце, деталі"></textarea></label>
    <div class="err" id="err" role="alert"></div>
    <div class="acts"><button type="button" class="btn ghost" data-cancel>Скасувати</button><button class="btn" type="submit">Додати подію</button></div></form></div>`;
  } else {
    const evs = S.events.filter(e => e.start_at.startsWith(S.sel) && e.status !== 'dismissed');
    
    app.innerHTML = `
      <div class="header">
        <div>
          <div style="font-size: 24px; font-weight: 800;">${new Date(S.sel).toLocaleDateString('uk-UA', {weekday:'long'})}</div>
          <div style="color: var(--text-sec)">${new Date(S.sel).toLocaleDateString('uk-UA', {day:'numeric', month:'long'})}</div>
        </div>
        <button class="btn" data-add style="border-radius: 50%; width: 44px; height: 44px; padding:0">+</button>
      </div>

      <div style="padding: 0 16px; display: flex; gap: 8px; overflow-x: auto; margin-bottom: 20px;">
        ${[-1, 0, 1, 2, 3, 4, 5].map(i => {
          const d = addDays(todayKey(), i);
          const isSel = d === S.sel;
          return `<button class="chip" data-day="${d}" aria-pressed="${isSel}">${new Date(d).toLocaleDateString('uk-UA', {day:'numeric'})}</button>`;
        }).join('')}
      </div>

      <div style="flex: 1; padding: 0 16px;">
        ${evs.length ? evs.map(e => `
          <div class="field" style="background: var(--bg-sec); padding: 12px; border-radius: 12px;" data-ev="${e.id}">
            <div style="font-weight: bold;">${esc(e.title)}</div>
            <div style="font-size: 13px; color: var(--text-sec);">${e.start_at.slice(11,16)}</div>
            ${S.openId === e.id ? `<div class="acts"><button class="btn ghost" data-del="${e.id}">Видалити</button></div>` : ''}
          </div>
        `).join('') : `
          <div style="text-align: center; margin-top: 50px; color: var(--text-sec);">
            <b>Вільний день</b><br>Додайте подію або напишіть про неї в чаті.
          </div>
        `}
      </div>

      <div class="tabs">
        <button class="tab ${S.tab==='cal'?'active':''}" data-tab="cal">📅 Календар</button>
        <button class="tab ${S.tab==='bot'?'active':''}" data-tab="bot">🤖 Бот</button>
      </div>
    `;
  }
  bind();
}

// ---------- події (Ваш код з GitHub) ----------
function bind() {
  document.querySelectorAll("[data-tab]").forEach((b) => b.onclick = () => { S.tab = b.dataset.tab; buzz(); render(); if (S.tab === "bot" && S.chats === null) loadChats(); });
  document.querySelectorAll("[data-day]").forEach((b) => b.onclick = () => { S.sel = b.dataset.day; S.openId = null; buzz(); render(); });
  document.querySelectorAll("[data-wk]").forEach((b) => b.onclick = () => { S.sel = addDays(S.sel, 7 * +b.dataset.wk); S.openId = null; render(); });
  document.querySelectorAll("[data-ev]").forEach((b) => b.onclick = () => {
    const id = +b.dataset.ev; S.openId = S.openId === id ? null : id; render();
  });
  document.querySelectorAll("[data-del]").forEach((b) => b.onclick = () => mutate("event_delete", { id: +b.dataset.del }, "Подію видалено"));
  document.querySelectorAll("[data-ok]").forEach((b) => b.onclick = () => mutate("event_status", { id: +b.dataset.ok, status: "confirmed" }, "Додано в календар"));
  document.querySelectorAll("[data-no]").forEach((b) => b.onclick = () => mutate("event_status", { id: +b.dataset.no, status: "dismissed" }, "Пропущено"));
  const add = $("[data-add]"); if (add) add.onclick = () => { S.sheet = true; render(); const t = $('input[name="title"]'); t && t.focus(); };
  document.querySelectorAll(".chat .chip").forEach((b) => b.onclick = () => toggleChat(b));
  const q = $("#q"); if (q) q.oninput = debounce(() => { S.q = q.value; loadChats(true); }, 350);
  if (S.sheet) bindSheet();
}

function bindSheet() {
  const close = () => { S.sheet = false; render(); };
  $("[data-cancel]").onclick = close;
  $(".sheet-wrap").onclick = (e) => { if (e.target.classList.contains("sheet-wrap")) close(); };
  document.querySelectorAll(".opts .chip").forEach((b) => b.onclick = () => {
    b.parentElement.querySelectorAll(".chip").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
  });
  $("#f").onsubmit = async (e) => {
    e.preventDefault();
    const f = e.target, v = (g) => +f.querySelector(`[data-group=${g}] [aria-pressed=true]`).dataset.v;
    const title = f.title.value.trim();
    if (!title) { $("#err").textContent = "Введіть назву події."; return; }
    const btn = f.querySelector("[type=submit]"); btn.disabled = true;
    try {
      const j = await api("event_add", { title, start: `${f.date.value}T${f.time.value}`, duration_min: v("dur"), remind_min: v("rem"), notes: f.notes.value.trim() });
      S.events = j.events; S.sel = f.date.value; S.sheet = false; buzz("medium"); render(); toast("Подію додано");
    } catch (err) { btn.disabled = false; $("#err").textContent = errText(err); }
  };
}

async function mutate(action, body, okText) {
  try { const j = await api(action, body); S.events = j.events; S.openId = null; buzz("medium"); render(); toast(okText); }
  catch (e) { toast(errText(e)); }
}

async function toggleChat(btn) {
  const kind = btn.dataset.t, id = +btn.dataset.id;
  const c = S.chats.find((x) => x.chat_id === id); if (!c) return;
  const next = !c[kind]; c[kind] = next; btn.setAttribute("aria-pressed", String(next)); buzz();
  try { await api("toggle", { kind, chat_id: id, enabled: next }); }
  catch (e) { c[kind] = !next; btn.setAttribute("aria-pressed", String(!next)); toast(errText(e)); }
}

async function loadChats(keepFocus) {
  try {
    const j = await api("chats", { q: S.q });
    S.chats = j.chats;
    if (S.tab === "bot") { render(); }
  } catch (e) { S.chats = []; toast(errText(e)); if (S.tab === "bot") render(); }
}

function debounce(fn, ms) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; }

function demoApi(action, body) {
  const now = Date.now();
  const mk = (id, title, dh, dur, status, extra = {}) => ({ id, title, start_at: new Date(now + dh * 3600e3).toISOString(), end_at: new Date(now + (dh * 60 + dur) * 60e3).toISOString(), notes: null, source_name: null, remind_min: 30, status, ...extra });
  window.__demo ||= {
    events: [mk(1, "Сніданок із Катею", -3, 60, "confirmed", { source_name: "Катя" }), mk(2, "Дзвінок щодо проєкту", 2, 45, "confirmed", { notes: "Підготувати кошторис" }), mk(3, "Кіно", 5, 120, "confirmed", { source_name: "Катя", remind_min: 60 }), mk(4, "Прогулянка в парку", 27, 90, "pending", { source_name: "Оля" })],
    chats: [{ chat_id: 5, name: "Катя", flirt: true, mood: true }, { chat_id: 6, name: "Оля", flirt: false, mood: true }, { chat_id: 7, name: "Дмитро", flirt: false, mood: false }],
  };
  const D = window.__demo;
  if (action === "init") return Promise.resolve({ tz: "Europe/Kyiv", ai: "Groq", editor: true, hub: ["flirt"], events: D.events });
  if (action === "chats") return Promise.resolve({ chats: D.chats.filter((c) => c.name.toLowerCase().includes((body.q || "").toLowerCase())) });
  if (action === "event_delete") D.events = D.events.filter((e) => e.id !== body.id);
  if (action === "event_status") D.events = D.events.map((e) => (e.id === body.id ? { ...e, status: body.status } : e)).filter((e) => e.status !== "dismissed");
  if (action === "event_add") D.events.push({ id: Date.now(), title: body.title, start_at: new Date(body.start + "+02:00").toISOString(), end_at: new Date(new Date(body.start + "+02:00").getTime() + body.duration_min * 60e3).toISOString(), notes: body.notes || null, source_name: "Застосунок", remind_min: body.remind_min, status: "confirmed" });
  return Promise.resolve({ ok: true, events: D.events });
}

function applyTheme() {
  if (!tg) return;
  const light = tg.colorScheme === "light";
  document.documentElement.dataset.theme = light ? "light" : "dark";
}

async function start() {
  tg.ready(); tg.expand(); applyTheme();
  const app = $("#app");
  if (!initData && !DEMO) {
    app.innerHTML = `<div class="fatal"><b>Відкрийте застосунок із Telegram</b></div>`;
    return;
  }
  try {
    const j = await api("init");
    Object.assign(S, { tz: j.tz || S.tz, ai: j.ai, editor: !!j.editor, hub: j.hub || [], events: j.events || [] });
    S.sel = todayKey();
    render();
  } catch (e) {
    app.innerHTML = `<div class="fatal"><b>Не вдалося відкрити</b></div>`;
  }
}
start();
</script>
</body>
</html>
